<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>주현 가계부</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<header id="top">
  <div class="brand">
    <span class="eyebrow">주현 가계부</span>
    <h1 id="topTitle">이번 달</h1>
  </div>
  <div class="topact">
    <button id="lockBtn" class="icobtn" title="편집 잠금" aria-label="편집 잠금">잠김</button>
    <button id="reloadBtn" class="icobtn" title="새로고침" aria-label="새로고침">새로고침</button>
  </div>
</header>

<nav id="tabstrip" aria-label="달 고르기"></nav>

<main id="main">
  <section id="p-month" class="page"></section>
  <section id="p-trend" class="page" hidden></section>
  <section id="p-book"  class="page" hidden></section>
  <section id="p-theme" class="page" hidden></section>
  <section id="p-add"   class="page" hidden></section>
</main>

<button id="fab" aria-label="기록 추가">+</button>

<nav id="tabbar">
  <button data-tab="month" class="on"><span>이번 달</span></button>
  <button data-tab="trend"><span>추이</span></button>
  <button data-tab="book"><span>장부</span></button>
  <button data-tab="theme"><span>테마</span></button>
  <button data-tab="add"><span>입력</span></button>
</nav>

<div id="modal" hidden><div class="sheetwrap"><div id="modalBody" class="sheet"></div></div></div>
<div id="toast" hidden></div>
<footer id="stamp"></footer>

<script src="js/config.js?v=1"></script>
<script src="js/core.js?v=1"></script>
<script src="js/widgets.js?v=1"></script>
<script src="js/auth.js?v=1"></script>
<script src="js/page-month.js?v=1"></script>
<script src="js/page-trend.js?v=1"></script>
<script src="js/page-book.js?v=1"></script>
<script src="js/page-theme.js?v=1"></script>
<script src="js/page-add.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
