/* ===== js/suggest.js ===== */
/* suggest.js - 지난 기록에서 배워 입력칸을 미리 채운다.
   따로 학습을 돌리지 않는다. 앱을 켤 때마다 시트를 통째로 읽으므로,
   줄이 쌓일수록 이 추천이 저절로 좋아진다. 지금은 9천 줄이 재료다. */
FILEV.suggest = CONFIG.APP_VERSION;

/** 가맹점 이름을 견줄 수 있게 다듬는다. 지점명과 괄호와 띄어쓰기를 털어 낸다. */
function normPlace(s) {
  return String(s || "")
    .normalize("NFKC")
    .replace(/\(.*?\)/g, " ")
    .replace(/[0-9]+호점|[0-9]+점/g, " ")
    .replace(/주식회사|\\(주\\)/g, " ")
    .replace(/\u321C/g, " ")   /* 원문자 주. 기본 키보드에 없어 코드로 적는다 */
    .replace(/[^0-9A-Za-z가-힣]+/g, "")
    .toLowerCase();
}

/** 그 장소에서 예전에 무엇으로 적었나. 최근 것에 무게를 더 준다. */
function suggestFor(place, amt) {
  const key = normPlace(place);
  if (!key || key.length < 2) return null;

  let hits = S.rows.filter(r => normPlace(r.place) === key);
  if (!hits.length) {
    /* 똑같지 않으면 앞뒤로 품은 이름까지 찾아본다 */
    hits = S.rows.filter(r => {
      const k = normPlace(r.place);
      return k.length >= 2 && (k.indexOf(key) === 0 || key.indexOf(k) === 0);
    });
  }
  if (!hits.length) return null;

  const today = new Date(todayISO());
  const weight = r => {
    const days = Math.max(0, (today - new Date(r.date)) / 86400000);
    return 1 / (1 + days / 540);        /* 한 해 반이 지나면 무게가 반쯤 */
  };
  const top = field => {
    const m = new Map();
    for (const r of hits) {
      const v = r[field];
      if (!v) continue;
      m.set(v, (m.get(v) || 0) + weight(r));
    }
    if (!m.size) return null;
    const arr = Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
    const sum = arr.reduce((a, x) => a + x[1], 0);
    return { v: arr[0][0], share: arr[0][1] / sum, alts: arr.slice(1, 3).map(x => x[0]) };
  };

  const amts = hits.map(r => r.amt).sort((a, b) => a - b);
  const med = amts[Math.floor(amts.length / 2)];
  const near = amt ? Math.abs(amt - med) / Math.max(1, med) : null;

  return {
    n: hits.length,
    last: hits[hits.length - 1],
    sub: top("sub"), pay: top("pay"), situ: top("situ"),
    share: top("share"), treat: top("treat"), theme: top("theme"),
    detail: top("detail"),
    median: med,
    odd: (near != null && near > 1.5 && hits.length >= 3) ? med : null,
  };
}

/* ---------- 시각으로 끼니를 짚는다 ----------
   18시 12분에 밥을 먹었는데 상황이 점심으로 잡히면 곤란하다.
   장소의 지난 버릇보다 그날 그 시각이 우선이다. */
const MEAL_SUBS = /^(구내식당|치킨|피자\/버거|분식|한식|고기\/구이|일식|중식|양식|아시안|뷔페|도시락|식당기타|배달앱|카페|베이커리|디저트|주점|유흥)$/;
function situByTime(time, sub) {
  const m = String(time || "").match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const h = +m[1];
  const eat = MEAL_SUBS.test(sub || "");
  if (h >= 5 && h < 10) return eat ? "아침" : null;
  if (h >= 10 && h < 15) return eat ? "점심" : null;
  if (h >= 16 && h < 21) return eat ? "저녁" : null;
  if (h >= 21 || h < 4) return eat ? "야식" : null;
  return eat ? "간식" : null;
}

/** 추천을 칸에 넣는다. 비어 있는 칸만 건드린다. */
function applySuggest(sg, scope, ctx) {
  const R = scope || fscope();
  const done = [];
  /* 시각이 있으면 끼니는 그쪽을 따른다 */
  if (ctx && ctx.time) {
    const subNow = $("#f_sub", R) ? $("#f_sub", R).value : "";
    const guess = situByTime(ctx.time, subNow || (sg && sg.sub ? sg.sub.v : ""));
    const n = $("#f_situ", R);
    if (guess && n && !n.value && Array.from(n.options).some(x => x.value === guess)) {
      n.value = guess;
      done.push("상황 " + guess + " (" + ctx.time + ")");
    }
  }
  if (!sg) return done;
  const put = (id, o, label) => {
    if (!o || o.share < 0.4) return;
    const n = $(id, R);
    if (!n || n.value) return;
    /* 목록에 없는 값은 넣지 않는다 */
    if (n.tagName === "SELECT" && !Array.from(n.options).some(x => x.value === o.v)) return;
    n.value = o.v;
    done.push(label + " " + o.v + " (" + Math.round(o.share * 100) + "%)");
  };
  put("#f_sub", sg.sub, "소분류");
  put("#f_pay", sg.pay, "결제수단");
  put("#f_situ", sg.situ, "상황");
  put("#f_share", sg.share, "누구 몫");
  put("#f_treat", sg.treat, "대접");
  return done;
}

/** 추천을 말로 풀어 준다. */
function suggestHTML(sg, ctx) {
  const pre = [];
  if (ctx && ctx.time) {
    const g = situByTime(ctx.time, ctx.sub || (sg && sg.sub ? sg.sub.v : ""));
    if (g) pre.push('<div class="rhint"><b>결제 시각</b><span>' + esc(ctx.time) +
      " 이니 상황은 <b>" + esc(g) + "</b> 로 봅니다. 장소의 지난 버릇보다 그날 그 시각을 먼저 봅니다.</span></div>");
  }
  if (!sg) return pre.join("");
  const bits = [];
  const say = (o, name) => { if (o && o.share >= 0.3) bits.push(name + " <b>" + esc(o.v) + "</b> " + Math.round(o.share * 100) + "%"); };
  say(sg.sub, "소분류"); say(sg.pay, "결제수단"); say(sg.situ, "상황"); say(sg.treat, "대접");
  if (!bits.length) return pre.join("");
  return pre.join("") + '<div class="rhint"><b>지난 기록</b><span>이 곳에서 <b>' + sg.n + "번</b> 썼습니다. " + bits.join(" / ") +
    ". 보통 " + won(sg.median) + "원." +
    (sg.odd ? ' <b style="color:var(--coral)">이번 금액은 평소와 많이 다릅니다.</b>' : "") +
    "</span></div>";
}

/* ===== js/auth.js ===== */
/* auth.js - 조회는 자유, 쓰기는 잠금.
   비밀번호는 앱에 저장하지 않고 서버가 확인한다. 10분이 지나면 다시 잠긴다. */
FILEV.auth = CONFIG.APP_VERSION;

const AUTH = { token: "", until: 0 };
const authAlive = () => AUTH.token && Date.now() < AUTH.until;

function authTouch() { if (AUTH.token) AUTH.until = Date.now() + 10 * 60 * 1000; paintLock(); }
function authLock() {
  AUTH.token = ""; AUTH.until = 0;
  A.data = null; A.loaded = false; A.denied = false;   /* 자산은 잠기면 화면에서도 지운다 */
  paintLock();
  if (S.tab === "asset") renderAsset();
  toast("잠갔습니다");
}

function paintLock() {
  const b = $("#lockBtn"); if (!b) return;
  const on = authAlive();
  b.textContent = on ? "열림" : "잠김";
  b.classList.toggle("open", on);
  b.title = on ? "누르면 다시 잠깁니다" : "편집하려면 비밀번호를 넣으세요";
}

/** 쓰기 직전에 부른다. 통과하면 true */
async function ensureAuth() {
  if (authAlive()) { authTouch(); return true; }
  const pw = await askPw();
  if (pw == null) return false;
  try {
    const j = await post("login", { pw });
    AUTH.token = j.token; authTouch();
    toast("편집을 열었습니다");
    return true;
  } catch (e) { toast("비밀번호가 맞지 않습니다"); return false; }
}

function askPw() {
  return new Promise(resolve => {
    openModal(
      '<h2 style="font-size:16px;margin-bottom:4px">편집 잠금 풀기</h2>' +
      '<p style="font-size:12.5px;color:var(--ink2);margin:0 0 14px">비밀번호를 넣으면 10분 동안 기록을 더하거나 고칠 수 있습니다.</p>' +
      '<div class="form"><div class="fl"><span>비밀번호</span>' +
      '<input id="pwIn" type="password" inputmode="numeric" autocomplete="current-password"></div>' +
      '<button class="btn" id="pwGo">열기</button>' +
      '<button class="btn ghost" id="pwNo">그만두기</button></div>',
      () => resolve(null)
    );
    const go = () => { const v = $("#pwIn").value.trim(); closeModal(true); resolve(v || null); };
    $("#pwGo").onclick = go;
    $("#pwIn").onkeydown = e => { if (e.key === "Enter") go(); };
    $("#pwNo").onclick = () => { closeModal(true); resolve(null); };
    setTimeout(() => $("#pwIn").focus(), 60);
  });
}

/* ---------- 모달 ---------- */
let _onClose = null;
function openModal(html, onClose) {
  _onClose = onClose || null;
  $("#modalBody").innerHTML = html;
  $("#modal").hidden = false;
  document.body.style.overflow = "hidden";
  /* 기기의 뒤로가기로 창이 닫히게 한 걸음 쌓아 둔다 */
  try { history.pushState({ tab: S.tab, m: 1 }, ""); } catch (e) { }
}
function closeModal(silent, viaPop) {
  $("#modal").hidden = true;
  document.body.style.overflow = "";
  const f = _onClose; _onClose = null;
  if (f && !silent) f();
  /* 화면에서 닫았으면 쌓아 둔 한 걸음도 함께 물린다 */
  if (!viaPop) {
    try {
      if (history.state && history.state.m) { NAV.skip = true; history.back(); }
    } catch (e) { }
  }
}



/* ===== js/page-month.js ===== */
/* page-month.js - 이번 달 한 장. 알림, 읽어 주는 말, 히어로, 견줌, 대분류, 달력, 큰 지출. */
FILEV.month = CONFIG.APP_VERSION;

const MO = { alertsOpen: false };

function renderMonth() {
  const ym = S.ym, rs = monthRows(ym);
  const now = monthStat(ym), prev = monthStat(shiftYM(ym, -1)), last = monthStat(shiftYM(ym, -12));
  const avg = avgOutOfYear(yOf(ym + "-01"));
  const box = $("#p-month");

  /* 알림 */
  const AL = buildAlerts(ym);
  let alerts = alertsHTML(AL, MO.alertsOpen);
  if (!AL.length && DISMISS.count())
    alerts = '<div id="alertBox"><button class="btn ghost sm" id="alertBack" style="width:100%;margin-bottom:8px">' +
      "숨긴 알림 " + DISMISS.count() + "건 되살리기</button></div>";

  /* 히어로 */
  const hero =
    '<div class="card hero">' +
    '<span class="eyebrow">' + ym.slice(0, 4) + "년 " + (+ym.slice(5, 7)) + "월 지출</span>" +
    '<div class="big">' + won(now.out) + '<span class="won">원</span></div>' +
    '<div class="sub">' +
    "<span>전액 <b>" + won(now.outFull) + "</b></span>" +
    "<span>수입 <b>" + won(now.inc) + "</b></span>" +
    "<span>이체 저축 <b>" + won(now.mov) + "</b></span>" +
    "<span>남은 돈 <b>" + won(now.left) + "</b></span>" +
    "<span>" + now.n + "건</span></div></div>";

  /* 읽어 주는 말 */
  const ins = INSIGHT.build(ym);
  const insCard = ins.length
    ? '<div class="card"><div class="sec"><h2>읽어 보면</h2><span class="hint">규칙으로 찾은 신호</span></div>' +
      '<div class="ins">' + ins.map(i =>
        '<div class="i"><span class="k ' + i.kind + '">' + esc(i.tag) + "</span><div>" + i.html + "</div></div>").join("") +
      "</div></div>"
    : "";

  /* 자산 한 줄 */
  let assetLine = "";
  if (A.data) {
    const gap = assetGap();
    assetLine =
      '<div class="card tight"><div class="sec" style="margin-bottom:8px"><h2>지금 가진 것</h2>' +
      '<span class="hint">' + esc(A.data.asOf || "") + " 기준</span></div>" +
      '<div class="rows">' +
      '<div class="row"><div class="nm">모은 돈 (원금)</div><div class="amt">' + won(assetTotal()) + "</div></div>" +
      '<div class="row"><div class="nm">지금 값 (평가)</div><div class="amt" style="color:' +
      (gap >= 0 ? "var(--in)" : "var(--out)") + '">' + won(assetValued()) +
      " (" + (gap >= 0 ? "+" : "-") + wonS(Math.abs(gap)) + ")</div></div></div>" +
      '<p class="foot">자산 탭에서 자세히 봅니다. 가계부와 갱신 주기가 달라 기준일을 함께 적습니다.</p></div>';
  }

  /* 견줌 */
  const cmp = [
    { k: "지난달", v: prev.out, d: pct(now.out, prev.out) },
    { k: "작년 같은 달", v: last.out, d: pct(now.out, last.out) },
    { k: "올해 월평균", v: avg, d: pct(now.out, avg) },
  ];
  const mx = Math.max(now.out, ...cmp.map(c => c.v), 1);
  const cmpCard =
    '<div class="card"><div class="sec"><h2>무엇과 견주면</h2><span class="hint">채운 부분이 이번 달</span></div>' +
    '<div class="rows">' +
    '<div class="row"><div class="nm">이번 달</div><div class="amt">' + won(now.out) + "</div>" +
    '<div class="bar"><div class="dbar"><i class="mine" style="width:' + (now.out / mx * 100).toFixed(1) + '%;background:var(--navy)"></i></div></div></div>' +
    cmp.map(c =>
      '<div class="row"><div class="nm">' + c.k + "</div>" +
      '<div class="amt">' + won(c.v) + " " + deltaBadge(c.d, false) + "</div>" +
      '<div class="bar"><div class="dbar"><i class="mine" style="width:' + (c.v / mx * 100).toFixed(1) + '%;background:var(--line)"></i></div></div></div>'
    ).join("") + "</div></div>";

  /* 대분류 */
  const outs = rs.filter(isOut);
  const bigs = byKey(outs, r => r.big || "기타");
  const prevBig = {}; byKey(monthRows(shiftYM(ym, -1)).filter(isOut), r => r.big || "기타").forEach(b => prevBig[b.key] = b.mine);
  const bigCard =
    '<div class="card"><div class="sec"><h2>어디에 썼나</h2><span class="hint">지난달 대비</span></div>' +
    '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' + donut(bigs.slice(0, 8)) +
    '<div style="flex:1;min-width:190px">' + rankList(bigs.slice(0, 8), bigs[0] && bigs[0].mine, {
      color: it => colorOf(it.key),
      extra: it => { const d = pct(it.mine, prevBig[it.key]); return d == null ? "새로" : (d > 0 ? "+" : "") + Math.round(d * 100) + "%"; },
    }) + "</div></div></div>";

  /* 달력 */
  const calCard = '<div class="card"><div class="sec"><h2>날마다</h2><span class="hint">칸이 찰수록 많이 쓴 날</span></div>' + calendar(ym, rs) + "</div>";

  /* 큰 지출 */
  const top = outs.slice().sort((a, b) => b.mine - a.mine).slice(0, 6);
  const topCard = '<div class="card"><div class="sec"><h2>큰 지출</h2><span class="hint">내 몫 기준</span></div>' +
    (top.length ? '<div class="rows">' + top.map(r =>
      '<div class="row"><div class="nm">' + esc(r.place || r.sub) + "</div>" +
      '<div class="amt">' + won(r.mine) + "</div>" +
      '<div class="meta"><span>' + r.date.slice(5).replace("-", "/") + "</span><span>" + esc(r.sub) + "</span>" +
      (r.detail ? "<span>" + esc(r.detail) + "</span>" : "") +
      (r.amt > r.mine ? "<span>전액 " + won(r.amt) + "</span>" : "") + "</div></div>"
    ).join("") + "</div>" : '<div class="empty">이 달 지출 기록이 없습니다.</div>') + "</div>";

  const storyBtn = '<div class="card tight"><button class="btn ghost" id="storyBtn">이 달 결산 카드 만들기</button></div>';

  box.innerHTML = alerts + hero + insCard + assetLine + cmpCard + bigCard + calCard + topCard + storyBtn;

  const show = MO.alertsOpen ? AL : AL.slice(0, 2);
  $$("[data-ago]", box).forEach(b => b.onclick = () => show[+b.dataset.ago].act.go());
  $$("[data-askip]", box).forEach(b => b.onclick = () => { DISMISS.skip(b.dataset.askip, ym); renderMonth(); });
  $$("[data-amute]", box).forEach(b => b.onclick = () => {
    DISMISS.mute(b.dataset.amute);
    toast("이 갈래를 껐습니다. 아래 [숨긴 알림 되살리기] 로 되돌립니다");
    renderMonth();
  });
  const more = $("#alertMore", box);
  if (more) more.onclick = () => { MO.alertsOpen = !MO.alertsOpen; renderMonth(); };
  const back = $("#alertBack", box);
  if (back) back.onclick = () => { DISMISS.reset(); toast("숨긴 알림을 모두 되살렸습니다"); renderMonth(); };
  $("#storyBtn").onclick = () => openStory(S.ym);
}


/* ===== js/page-ledger.js ===== */
/* page-ledger.js - 원장. 옛 가계부 시트의 월별 탭 그대로,
   그 달의 모든 날짜를 하루도 빠짐없이 세로로 세운다. 쓴 날도 안 쓴 날도 보인다. */
FILEV.ledger = CONFIG.APP_VERSION;

const LG = { dense: false, hideEmpty: false };

function renderLedger() {
  const ym = S.ym, box = $("#p-ledger");
  const rs = monthRows(ym);
  const st = monthStat(ym);
  const y = +ym.slice(0, 4), mo = +ym.slice(5, 7);
  const lastDay = new Date(y, mo, 0).getDate();

  /* 날짜별로 모은다 */
  const byDay = new Map();
  for (const r of rs) {
    const d = +r.date.slice(8, 10);
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(r);
  }
  const dayOut = d => (byDay.get(d) || []).reduce((a, r) => a + (isOut(r) ? r.mine : 0), 0);
  const maxDayOut = Math.max(1, ...Array.from({ length: lastDay }, (_, i) => dayOut(i + 1)));

  /* 머리 띠. 옛 시트의 첫 줄을 옮긴 것 */
  const strip =
    '<div class="card tight ledhead">' +
    (A.data ? '<div class="lh"><span>보유 자산</span><b class="num" style="color:var(--gold)">' + won(assetTotal()) + "</b></div>" : "") +
    '<div class="lh"><span>수입</span><b class="num" style="color:var(--jade)">' + won(st.inc) + "</b></div>" +
    '<div class="lh"><span>지출</span><b class="num" style="color:var(--coral)">' + won(st.out) + "</b></div>" +
    '<div class="lh"><span>남은 돈</span><b class="num">' + won(st.left) + "</b></div>" +
    "</div>";

  const opts =
    '<div class="ledopt">' +
    '<button class="chip' + (LG.hideEmpty ? " on" : "") + '" id="lgEmpty">빈 날 접기</button>' +
    '<button class="chip' + (LG.dense ? " on" : "") + '" id="lgDense">좁게</button>' +
    '<span class="ledcount">' + rs.length + "줄 / " + lastDay + "일</span></div>";

  /* 본문 */
  let body = "";
  for (let d = 1; d <= lastDay; d++) {
    const date = ym + "-" + pad2(d);
    const wd = new Date(date + "T00:00:00").getDay();
    const list = byDay.get(d) || [];
    if (LG.hideEmpty && !list.length) continue;
    const hol = holidayOf(date);
    const wcls = (hol || wd === 0) ? " sun" : wd === 6 ? " sat" : "";
    const isToday = date === todayISO();
    const dOut = dayOut(d);

    const dayCell =
      '<td class="dcell' + wcls + (isToday ? " today" : "") + '" rowspan="' + Math.max(1, list.length) + '">' +
      '<div class="dn">' + pad2(d) + '<span class="dw">' + WD[wd] + "</span></div>" +
      (hol ? '<div class="dhol" title="' + esc(hol) + '">' + esc(hol) + "</div>" : "") +
      (dOut ? '<div class="dsum">' + won(dOut) + "</div>" +
        '<div class="dbarmini"><i style="width:' + (dOut / maxDayOut * 100).toFixed(1) + '%"></i></div>' : "") +
      "</div>";

    if (!list.length) {
      body += '<tr class="newday empty-day" data-add="' + date + '">' + dayCell +
        '<td colspan="5" class="none">기록 없음</td></tr>';
      continue;
    }
    list.forEach((r, i) => {
      const inK = isIn(r), movK = isMov(r);
      body += '<tr class="' + (i === 0 ? "newday" : "") + (r.검수 ? " need" : "") + '" data-no="' + r.no + '">' +
        (i === 0 ? dayCell : "") +
        '<td class="money in">' + (inK ? won(r.amt) : "") + "</td>" +
        '<td class="money ' + (movK ? "mov" : "out") + '">' + (inK ? "" : won(r.amt)) + "</td>" +
        '<td class="pl">' + esc(r.place || "") +
        (r.rate < 1 ? '<span class="rate">' + Math.round(r.rate * 100) + "%</span>" : "") +
        (r.time ? '<span class="rate">' + esc(r.time) + "</span>" : "") + "</td>" +
        '<td class="de">' + esc(r.detail || "") +
        (r.disc ? '<span class="disc">할인 ' + won(r.disc) + (r.discBy ? " " + esc(r.discBy) : "") +
          " (실결제 " + won(r.real) + ")</span>" : "") + "</td>" +
        '<td class="cat"><span class="catchip" style="background:' + colorOf(r.big || "기타") + '22;color:' +
        colorOf(r.big || "기타") + '">' + esc(r.sub || "") + "</span>" +
        (r.situ || r.treat || r.theme ? '<span class="tags">' + [r.situ, r.treat, r.theme].filter(Boolean).map(esc).join(" ") + "</span>" : "") +
        "</td></tr>";
    });
  }

  const table =
    '<div class="card tight"><div class="sec"><h2>' + y + "년 " + mo + "월 원장</h2>" +
    '<span class="hint">줄을 누르면 고칩니다</span></div>' + opts +
    '<div class="scrollx"><table class="led' + (LG.dense ? " dense" : "") + '"><thead><tr>' +
    "<th>날짜</th><th>수입</th><th>지출</th><th>장소</th><th>세부내역</th><th>분류</th>" +
    "</tr></thead><tbody>" + body +
    '<tr class="sumrow"><td>합계</td>' +
    '<td class="money in">' + won(sumAmt(rs, isIn)) + "</td>" +
    '<td class="money out">' + won(sumAmt(rs, isOut) + sumAmt(rs, isMov)) + "</td>" +
    '<td colspan="3" class="de">내 몫 지출 ' + won(st.out) + " / 이체 저축 " + won(st.mov) + "</td></tr>" +
    "</tbody></table></div>" +
    '<p class="foot">표의 금액은 전액입니다. 장소 옆 퍼센트는 내가 부담한 몫이고, 날짜 칸의 작은 숫자는 그날 내 몫 지출입니다. ' +
    "빈 날을 누르면 그 날짜로 새 줄을 적습니다.</p></div>";

  /* 하루 흐름 */
  const days = Array.from({ length: lastDay }, (_, i) => ({
    key: String(i + 1), mine: dayOut(i + 1),
    color: [0, 6].includes(new Date(ym + "-" + pad2(i + 1) + "T00:00:00").getDay()) ? "var(--sky)" : "var(--coral)",
    hi: ym + "-" + pad2(i + 1) === todayISO(),
  }));
  const flow = '<div class="card"><div class="sec"><h2>날마다</h2><span class="hint">파란 막대가 주말</span></div>' +
    barsHTML(days, { h: 120 }) +
    '<div class="legend"><span>기록한 날 ' + byDay.size + "일</span><span>안 쓴 날 " + (lastDay - byDay.size) + "일</span>" +
    "<span>가장 많이 쓴 날 " + won(maxDayOut) + "</span></div></div>";

  box.innerHTML = strip + table + flow;
  decorate(box);

  $("#lgEmpty").onclick = () => { LG.hideEmpty = !LG.hideEmpty; renderLedger(); };
  $("#lgDense").onclick = () => { LG.dense = !LG.dense; renderLedger(); };
  /* 짧게 누르면 고치기, 꾹 누르면 그날 안에서 순서 바꾸기 */
  $$("tbody tr[data-no]", box).forEach(tr => {
    const no = +tr.dataset.no;
    let timer = null, long = false;
    const start = () => { long = false; timer = setTimeout(() => { long = true; openMove(no); }, 480); };
    const stop = () => { if (timer) clearTimeout(timer); timer = null; };
    tr.addEventListener("touchstart", start, { passive: true });
    tr.addEventListener("touchend", stop);
    tr.addEventListener("touchmove", stop);
    tr.addEventListener("mousedown", start);
    tr.addEventListener("mouseup", stop);
    tr.addEventListener("mouseleave", stop);
    tr.onclick = () => {
      if (long) { long = false; return; }
      const r = S.rows.find(x => x.no === no);
      if (r) openEdit(r);
    };
  });
  $$("tbody tr[data-add]", box).forEach(tr => tr.onclick = () => {
    goTab("add");
    setTimeout(() => prefillAdd({ date: tr.dataset.add }), 60);
  });
}


/** 같은 날 안에서 차례를 바꾼다.
    화면에서는 곧바로 바뀌고, [저장] 을 눌러야 시트에 간다.
    줄을 눌러 고를 수 있으므로 꾹 누른 것 말고 다른 줄도 옮길 수 있다. */
function openMove(no) {
  const r = S.rows.find(x => x.no === +no);
  if (!r) return;
  const base = S.rows.filter(x => x.date === r.date);
  if (base.length < 2) return toast("그날 기록이 하나뿐입니다");

  const MV = { list: base.slice(), pick: +no, date: r.date };
  const orig = base.map(x => x.no).join(",");

  const paint = () => {
    const at = MV.list.findIndex(x => x.no === MV.pick);
    const dirty = MV.list.map(x => x.no).join(",") !== orig;
    return '<h2 style="font-size:16px;margin-bottom:2px">순서 바꾸기</h2>' +
      '<p style="font-size:11.5px;color:var(--ink3);margin:0 0 12px">' + esc(MV.date) +
      " 안에서만 옮깁니다. 옮길 줄을 눌러 고른 뒤 위아래로 움직이세요. no 는 바뀌지 않습니다.</p>" +
      '<div class="rows">' + MV.list.map((x, k) =>
        '<div class="row mvrow' + (x.no === MV.pick ? " mv" : "") + '" data-mv="' + x.no + '">' +
        '<div class="nm">' + (k + 1) + ". " + esc(x.place || x.sub) + "</div>" +
        '<div class="amt">' + won(x.amt) + "</div>" +
        '<div class="meta"><span>' + esc(x.sub || "") + "</span>" +
        (x.time ? "<span>" + esc(x.time) + "</span>" : "") + "</div></div>").join("") + "</div>" +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn ghost" id="mvUp"' + (at <= 0 ? " disabled" : "") + ">위로</button>" +
      '<button class="btn ghost" id="mvDn"' + (at >= MV.list.length - 1 ? " disabled" : "") + ">아래로</button>" +
      "</div>" +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
      '<button class="btn" id="mvSave"' + (dirty ? "" : " disabled") + ">" +
      (dirty ? "이대로 저장" : "바뀐 것이 없습니다") + "</button>" +
      '<button class="btn ghost" id="mvNo" style="max-width:96px">' + (dirty ? "버리기" : "닫기") + "</button></div>";
  };

  const bind = () => {
    $$("[data-mv]", $("#modalBody")).forEach(el => el.onclick = () => {
      MV.pick = +el.dataset.mv; redraw();
    });
    const at = MV.list.findIndex(x => x.no === MV.pick);
    const swap = d => {
      const j = at + d;
      if (j < 0 || j >= MV.list.length) return;
      const t = MV.list[at]; MV.list[at] = MV.list[j]; MV.list[j] = t;
      redraw();
    };
    const u = $("#mvUp"), dn = $("#mvDn");
    if (u && !u.disabled) u.onclick = () => swap(-1);
    if (dn && !dn.disabled) dn.onclick = () => swap(1);
    $("#mvNo").onclick = () => closeModal(true);
    const sv = $("#mvSave");
    if (sv && !sv.disabled) sv.onclick = async () => {
      if (!await ensureAuth()) return;
      sv.disabled = true; sv.textContent = "저장 중";
      try {
        await post("reorder", { token: AUTH.token, date: MV.date, order: MV.list.map(x => x.no) });
        /* 화면에 이미 보이는 차례 그대로 앱에도 앉힌다 */
        const seqs = base.map(x => x.seq).slice().sort((a, b) => a - b);
        MV.list.forEach((x, k) => { const row = S.rows.find(y => y.no === x.no); if (row) row.seq = seqs[k]; });
        S.rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq);
        cacheDrop();
        closeModal(true);
        DIRTY.month = DIRTY.ledger = DIRTY.spend = DIRTY.hall = 1;
        renderLedger();
        toast("차례를 저장했습니다");
      } catch (e) {
        sv.disabled = false; sv.textContent = "이대로 저장";
        toast("실패: " + e.message);
      }
    };
  };

  const redraw = () => { $("#modalBody").innerHTML = paint(); bind(); };
  openModal(paint());
  bind();
}

/* page-spend.js - 소비. 추이 / 분석 / 장부 셋을 한 탭에 담았다. */
FILEV.spend = CONFIG.APP_VERSION;

const SP = { seg: "trend" };

function renderSpend() {
  const box = $("#p-spend");
  box.innerHTML = segHTML([["trend", "추이"], ["ana", "분석"], ["book", "장부"]], SP.seg, "sp") +
    '<div id="spendBody"></div>';

}

function renderAnalysis() {
  const box = $("#spendBody");
  const ys = years().filter(y => y <= yOf(todayISO()));
  const outs = S.rows.filter(isOut);

  /* 잔디 */
  const grass = '<div class="card"><div class="sec"><h2>날마다</h2><span class="hint">진할수록 많이 쓴 날</span></div>' +
    heatHTML(dayMap(), 371) + "</div>";

  /* 해마다 */
  const yst = ys.map(y => yearStat(y));
  const yearCard = '<div class="card"><div class="sec"><h2>해마다</h2><span class="hint">내 몫 기준</span></div>' +
    barsHTML(yst.map(s => ({ key: s.y.slice(2), mine: s.out })), {}) +
    '<div style="overflow-x:auto"><table class="tbl" style="margin-top:12px"><thead><tr>' +
    "<th>해</th><th>수입</th><th>지출</th><th>남은 돈</th><th>저축률</th><th>달</th></tr></thead><tbody>" +
    yst.slice().reverse().map(s =>
      "<tr><td>" + s.y + '</td><td class="n">' + won(s.inc) + '</td><td class="n">' + won(s.out) +
      '</td><td class="n">' + won(s.left) + '</td><td class="n">' + (s.inc ? Math.round(s.left / s.inc * 100) + "%" : "-") +
      '</td><td class="n">' + s.months + "</td></tr>").join("") +
    "</tbody></table></div></div>";

  /* 개인 물가지수 */
  const cpi = cpiItems(3, 3).slice(0, 5);
  const pal = ["#B33A5A", "#0F7B6C", "#33518A", "#9A7B2E", "#7E8AA0"];
  const cpiCard = cpi.length
    ? '<div class="card"><div class="sec"><h2>내 물가</h2><span class="hint">되풀이해 간 곳의 건당 평균</span></div>' +
      lineChart(cpi.map((it, i) => ({
        color: pal[i], dot: true,
        pts: it.series.map(s => ({ x: s.y, y: Math.round(s.v / it.series[0].v * 100) })),
      })), { h: 160, zero: false }) +
      '<div class="rows" style="margin-top:12px">' + cpi.map((it, i) =>
        '<div class="row"><div class="nm"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:' +
        pal[i] + ';margin-right:6px"></i>' + esc(it.place) + "</div>" +
        '<div class="amt" style="color:' + (it.change >= 0 ? "var(--out)" : "var(--in)") + '">' +
        (it.change >= 0 ? "+" : "") + Math.round(it.change * 100) + "%</div>" +
        '<div class="meta"><span>' + it.series[0].y + "년 " + won(Math.round(it.series[0].v)) + "원</span>" +
        "<span>" + it.series[it.series.length - 1].y + "년 " + won(Math.round(it.series[it.series.length - 1].v)) + "원</span>" +
        "<span>" + it.n + "건</span></div></div>").join("") + "</div>" +
      '<p class="foot">첫 해를 100으로 놓고 건당 평균이 어떻게 변했는지 봅니다. 같은 곳에서 사는 것이 해마다 달라지면 값도 흔들리니 참고로만 보세요.</p></div>'
    : "";

  /* 요일과 달의 버릇 */
  const wd = weekdayProfile(outs), mp = monthProfile(outs);
  const habit = '<div class="card"><div class="sec"><h2>버릇</h2><span class="hint">쓴 날 하루 평균 / 달 평균</span></div>' +
    '<div style="font-size:11.5px;color:var(--ink3);margin-bottom:4px">요일</div>' +
    barsHTML(wd.map(w => ({ key: w.key, mine: w.mine, hi: w.mine === Math.max(...wd.map(x => x.mine)) })), { h: 110 }) +
    '<div style="font-size:11.5px;color:var(--ink3);margin:14px 0 4px">달</div>' +
    barsHTML(mp.map(m => ({ key: m.key.replace("월", ""), mine: m.mine, color: "var(--navy2)" })), { h: 110 }) + "</div>";

  /* 고정 지출 */
  const fx = fixedCosts().slice(0, 12);
  const fxSum = fx.reduce((a, f) => a + f.avg, 0);
  const fxCard = '<div class="card"><div class="sec"><h2>매달 나가는 것</h2>' +
    '<span class="hint">최근 여덟 달 중 여섯 달 이상</span></div>' +
    (fx.length
      ? '<p class="foot" style="margin:0 0 10px">한 달에 <b class="num">' + won(Math.round(fxSum)) + "</b>원이 이 목록으로 나갑니다.</p>" +
        rankList(fx.map(f => ({ key: f.place, mine: Math.round(f.avg), amt: Math.round(f.avg), n: f.n })),
          Math.round(fx[0].avg), { extra: it => "" })
      : '<div class="empty">아직 잡히는 것이 없습니다.</div>') + "</div>";

  /* 대분류를 쌓아 올린 달마다 */
  const ms18 = Array.from(new Set(S.rows.map(r => r.ym)))
    .filter(m => m && m <= ymOf(todayISO())).sort().slice(-18);
  const topBigs = byKey(outs, r => r.big || "기타").slice(0, 6).map(b => b.key);
  const cache = new Map();
  const getBig = (m, k) => {
    if (!cache.has(m)) {
      const o = {};
      for (const r of monthRows(m)) if (isOut(r)) { const b = r.big || "기타"; o[b] = (o[b] || 0) + r.mine; }
      let etc = 0;
      for (const b in o) if (topBigs.indexOf(b) < 0) etc += o[b];
      o["그 밖"] = etc;
      cache.set(m, o);
    }
    return cache.get(m)[k] || 0;
  };
  const stack = '<div class="card"><div class="sec"><h2>쌓아 보면</h2>' +
    '<span class="hint">최근 ' + ms18.length + "달, 큰 여섯 갈래</span></div>" +
    stackHTML(ms18, topBigs.concat(["그 밖"]), getBig, { h: 180 }) + "</div>";

  /* 수입 지출 남은 돈 */
  const ms24 = Array.from(new Set(S.rows.map(r => r.ym)))
    .filter(m => m && m <= ymOf(todayISO())).sort().slice(-24);
  const sts = ms24.map(m => ({ m, s: monthStat(m) }));
  const three = '<div class="card"><div class="sec"><h2>들어오고 나간 것</h2>' +
    '<span class="hint">최근 ' + ms24.length + "달</span></div>" +
    lineChart([
      { color: "var(--jade)", w: 2.2, pts: sts.map(x => ({ x: x.m, y: x.s.inc })) },
      { color: "var(--coral)", w: 2.2, pts: sts.map(x => ({ x: x.m, y: x.s.out })) },
      { color: "var(--gold)", w: 1.6, dash: true, pts: sts.map(x => ({ x: x.m, y: Math.max(0, x.s.left) })) },
    ], { h: 175, label: x => x.slice(2).replace("-", ".") }) +
    '<div class="legend"><span><i style="background:var(--jade)"></i>수입</span>' +
    '<span><i style="background:var(--coral)"></i>지출</span>' +
    '<span><i style="background:var(--gold)"></i>남은 돈</span></div></div>';

  box.innerHTML = grass + three + stack + yearCard + cpiCard + habit + fxCard;
  decorate(box);
}

/* ===== js/page-trend.js ===== */
/* page-trend.js - 흐름. 올해와 최근 열두 달을 오간다. */
FILEV.trend = CONFIG.APP_VERSION;

const TR = { mode: "12" };   // "12" 최근 열두 달, 또는 연도 문자열

function renderTrend() {
  const box = $("#spendBody");
  const years = Array.from(new Set(S.rows.map(r => r.y))).filter(Boolean).sort().reverse();
  if (TR.mode !== "12" && !years.includes(TR.mode)) TR.mode = "12";

  const months = TR.mode === "12"
    ? Array.from({ length: 12 }, (_, i) => shiftYM(S.ym, -(11 - i)))
    : Array.from({ length: 12 }, (_, i) => TR.mode + "-" + pad2(i + 1));

  const stats = months.map(m => { const s = monthStat(m); return { ym: m, out: s.out, inc: s.inc, mov: s.mov, n: s.n, hi: m === S.ym }; });
  const used = stats.filter(s => s.n);
  const totOut = used.reduce((a, s) => a + s.out, 0);
  const totIn = used.reduce((a, s) => a + s.inc, 0);
  const avgOut = used.length ? totOut / used.length : 0;

  const chips = '<div class="chips">' +
    '<button class="chip' + (TR.mode === "12" ? " on" : "") + '" data-m="12">최근 열두 달</button>' +
    years.slice(0, 10).map(y => '<button class="chip' + (TR.mode === y ? " on" : "") + '" data-m="' + y + '">' + y + "년</button>").join("") +
    "</div>";

  const head =
    '<div class="card hero"><span class="eyebrow">' + (TR.mode === "12" ? "최근 열두 달" : TR.mode + "년") + " 지출</span>" +
    '<div class="big">' + won(totOut) + '<span class="won">원</span></div>' +
    '<div class="sub"><span>수입 <b>' + won(totIn) + "</b></span>" +
    "<span>달 평균 <b>" + won(avgOut) + "</b></span>" +
    "<span>기록된 달 <b>" + used.length + "</b></span>" +
    "<span>저축률 <b>" + (totIn ? Math.round((totIn - totOut) / totIn * 100) : 0) + "%</b></span></div></div>";

  const chart =
    '<div class="card"><div class="sec"><h2>달마다</h2><span class="hint">막대는 지출, 선은 수입</span></div>' +
    sparkMonths(stats, { line: true }) +
    '<div class="legend"><span><i style="background:var(--out)"></i>지출</span>' +
    '<span><i style="background:var(--navy)"></i>보고 있는 달</span>' +
    '<span><i style="background:var(--in)"></i>수입</span></div></div>';

  /* 달 표 */
  const rowsHtml = stats.map((s, i) => {
    const p = i ? stats[i - 1] : null;
    const d = p && p.out ? pct(s.out, p.out) : null;
    return '<div class="row"><div class="nm"><span class="num" style="font-size:12px;color:var(--ink3)">' + ymLabel(s.ym) + "</span> " +
      (s.n ? s.n + "건" : '<span style="color:var(--ink3)">기록 없음</span>') + "</div>" +
      '<div class="amt">' + (s.n ? won(s.out) + " " + deltaBadge(d, false) : "") + "</div>" +
      '<div class="bar">' + dbar(s.out, s.out, Math.max(1, ...stats.map(x => x.out))) + "</div></div>";
  }).join("");
  const table = '<div class="card"><div class="sec"><h2>달별 표</h2><span class="hint">전월 대비</span></div><div class="rows">' + rowsHtml + "</div></div>";

  /* 대분류 흐름 */
  const rs = S.rows.filter(r => months.includes(r.ym) && isOut(r));
  const bigs = byKey(rs, r => r.big || "기타").slice(0, 8);
  const bigCard = '<div class="card"><div class="sec"><h2>대분류 흐름</h2><span class="hint">이 구간 합계와 달 평균</span></div>' +
    rankList(bigs, bigs[0] && bigs[0].mine, {
      color: it => colorOf(it.key),
      extra: it => "달 평균 " + won(Math.round(it.mine / Math.max(1, used.length))),
    }) + "</div>";

  /* 소분류 상위 */
  const subs = byKey(rs, r => r.sub).slice(0, 12);
  const subCard = '<div class="card"><div class="sec"><h2>소분류 순위</h2><span class="hint">건당 평균</span></div>' +
    rankList(subs, subs[0] && subs[0].mine, { extra: it => "건당 " + won(Math.round(it.mine / it.n)) }) + "</div>";

  /* 자주 간 곳 */
  const places = byKey(rs, r => (r.place || "").trim()).slice(0, 10);
  const placeCard = '<div class="card"><div class="sec"><h2>자주 간 곳</h2><span class="hint">이 구간</span></div>' +
    rankList(places, places[0] && places[0].mine, { extra: it => "건당 " + won(Math.round(it.mine / it.n)) }) + "</div>";

  box.innerHTML = chips + head + chart + table + bigCard + subCard + placeCard;
  decorate(box);
  $$(".chip", box).forEach(c => c.onclick = () => { TR.mode = c.dataset.m; renderTrend(); });
}


/* ===== js/page-book.js ===== */
/* page-book.js - 옛 월별 탭 그대로. 날짜는 그날 첫 줄에만, 오른쪽에 통계 블록. */
FILEV.book = CONFIG.APP_VERSION;

function renderBook() {
  const ym = S.ym, rs = monthRows(ym);
  const box = $("#spendBody");
  if (!rs.length) { box.innerHTML = '<div class="card"><div class="empty">' + ym + " 기록이 없습니다.<br>아래 더하기 버튼으로 첫 줄을 적어 보세요.</div></div>"; return; }

  let lastDate = "", html = "";
  rs.forEach(r => {

    html +=
      "<tr" + (isNew ? ' class="newday"' : "") + ' data-no="' + r.no + '">' +
      '<td class="dt">' + (isNew ? r.date.slice(5).replace("-", "/") + " " + wdOf(r.date) : "") + "</td>" +
      '<td class="money ' + (r.kind === "수입" ? "in" : "") + '">' + (r.kind === "수입" ? won(r.amt) : "") + "</td>" +
      '<td class="money ' + cls + '">' + (r.kind === "수입" ? "" : won(r.amt)) + "</td>" +
      '<td class="pl">' + esc(r.place) + (r.rate < 1 ? ' <span style="color:var(--ink3);font-size:10px">' + Math.round(r.rate * 100) + "%</span>" : "") + "</td>" +
      '<td class="de">' + esc(r.detail) + "</td>" +
      "<td>" + esc(r.sub) + "</td>" +
      '<td class="de">' + [r.situ, r.treat, r.theme, r.once === "Y" ? "일시성" : "", r.pay].filter(Boolean).map(esc).join(" ") + "</td>" +
      "</tr>";
    lastDate = r.date;
  });

  const st = monthStat(ym);
  const bigs = byKey(rs.filter(isOut), r => r.big || "기타");

  box.innerHTML =
    '<div class="card tight"><div class="sec"><h2>' + ym.slice(0, 4) + "년 " + (+ym.slice(5, 7)) + "월 원장</h2>" +
    '<span class="hint">' + rs.length + "줄</span></div>" +
    '<div class="scrollx"><table class="book"><thead><tr>' +
    "<th>날짜</th><th>수입</th><th>지출</th><th>장소</th><th>세부내역</th><th>소분류</th><th>표시</th>" +
    "</tr></thead><tbody>" + html + "</tbody></table></div>" +
    '<p style="font-size:11px;color:var(--ink3);margin:10px 0 0">금액은 전액입니다. 장소 옆의 퍼센트는 내가 부담한 몫입니다. 줄을 누르면 고칠 수 있습니다.</p></div>' +

    '<div class="card"><div class="sec"><h2>이 달 통계</h2><span class="hint">내 몫 기준</span></div>' +
    '<div class="rows">' +
    ['수입|' + st.inc, '지출|' + st.out, '이체 저축|' + st.mov, '남은 돈|' + st.left].map(t => {
      const [k, v] = t.split("|");
      return '<div class="row"><div class="nm">' + k + '</div><div class="amt">' + won(+v) + "</div></div>";
    }).join("") + "</div>" +
    '<div style="height:10px"></div>' +
    rankList(bigs, bigs[0] && bigs[0].mine, { color: it => colorOf(it.key) }) + "</div>";

  decorate(box);
  $$("tbody tr", box).forEach(tr => tr.onclick = () => {
    const r = S.rows.find(x => x.no === +tr.dataset.no);
    if (r) openEdit(r);
  });
}



/* ===== js/page-asset.js ===== */
/* page-asset.js - 자산. 두 번째 DB(종합 자산 포트폴리오)를 읽기 전용으로 본다.
   현황 / 투자 / 수입원 셋. 가계부와 갱신 주기가 달라 어디에나 기준일을 붙인다. */
FILEV.asset = CONFIG.APP_VERSION;

const AS = { seg: "now" };

async function loadAssets() {
  if (A.loaded || A.denied) return;
  if (CONFIG.ASSET_NEEDS_AUTH && !authAlive()) return;
  try {
    const j = await post("assets", { token: AUTH.token });
    A.data = j.assets || null; A.reason = j.reason || ""; A.loaded = true;
  } catch (e) { A.denied = true; A.reason = e.message; toast("자산을 읽지 못했습니다: " + e.message); }
}

function renderAsset() {
  const box = $("#p-asset");

  if (CONFIG.ASSET_NEEDS_AUTH && !authAlive()) {
    box.innerHTML = '<div class="card"><div class="locked">자산은 잠겨 있습니다.<br>' +
      "가계부와 달리 이 화면은 비밀번호를 넣어야 열립니다.<br>10분이 지나면 다시 잠깁니다." +
      '<button class="btn" id="asUnlock">잠금 풀기</button></div></div>';
    $("#asUnlock").onclick = async () => { if (await ensureAuth()) { await loadAssets(); renderAsset(); } };
    return;
  }
  if (!A.loaded) {
    box.innerHTML = '<div class="card"><div class="skel" style="width:40%"></div>' +
      '<div class="skel" style="height:38px;margin:12px 0"></div><div class="skel" style="width:70%"></div></div>';
    loadAssets().then(() => renderAsset());
    return;
  }
  if (!A.data) {
    box.innerHTML = A.reason === "not_configured"
      ? '<div class="card"><div class="locked">자산 시트가 아직 이어져 있지 않습니다.<br><br>' +
        "Apps Script 의 <b>Portfolio.gs</b> 맨 위<br><b>PORTFOLIO_ID</b> 에 포트폴리오 시트 ID 를 넣어 주세요.<br>" +
        "시트 주소의 /d/ 와 /edit 사이 문자열입니다.<br>가계부 시트 ID 가 아닙니다.<br><br>" +
        "넣은 뒤 checkPortfolio() 를 한 번 실행하면<br>어느 시트에 붙었는지 확인할 수 있습니다.</div></div>"
      : '<div class="card"><div class="empty">자산 시트를 읽지 못했습니다.' +
        (A.reason ? "<br>" + esc(A.reason) : "") + "<br>시트 공유 권한을 확인해 주세요.</div></div>";
    return;
  }

  box.innerHTML = segHTML([["now", "현황"], ["inv", "투자"], ["inc", "수입원"]], AS.seg, "as") +
    '<div id="assetBody"></div>';
  $$("[data-as]", box).forEach(b => b.onclick = () => { AS.seg = b.dataset.as; renderAsset(); });

  if (AS.seg === "inv") assetInvest();
  else if (AS.seg === "inc") assetIncome();
  else assetNow();
  decorate(box);
}

/* ---------- 1) 현황 ---------- */

  const box = $("#assetBody");

    '<div class="big">' + won(assetTotal()) + '<span class="won">원</span></div>' +
    '<div class="sub"><span>지금 값 <b>' + won(assetValued()) + "</b></span>" +
    "<span>평가손익 <b style=\"color:" + (gap >= 0 ? "var(--in)" : "var(--out)") + '">' +
    (gap >= 0 ? "+" : "-") + won(Math.abs(gap)) + "</b></span>" +
    "<span>기준 <b>" + esc(A.data.asOf || "") + "</b></span></div>" +
    '<p class="foot">원금은 넣은 돈, 지금 값은 시세를 반영한 값입니다. 가계부는 원금 쪽과 맞물립니다.</p></div>';

  /* 순자산 곡선 */
  const nw = netWorthSeries();
  const series = [];
  if (nw.est.length) series.push({ color: "var(--ink3)", dash: true, w: 1.6, pts: nw.est.map(p => ({ x: p.ym, y: p.v })) });
  if (nw.real.length) series.push({ color: "var(--gold)", dot: true, w: 2.4, pts: nw.real.map(p => ({ x: p.ym, y: p.v })) });
  const curve = series.length
    ? '<div class="card"><div class="sec"><h2>모아 온 길</h2><span class="hint">점선은 가계부로 되짚은 추정</span></div>' +
      lineChart(series, { h: 165, zero: false, label: x => x.slice(2).replace("-", ".") }) +
      '<div class="legend"><span><i style="background:var(--gold)"></i>실측 스냅샷 ' + nw.real.length + "개</span>" +
      '<span><i style="background:var(--ink3)"></i>가계부 역산 ' + nw.est.length + "달</span></div>" +
      '<p class="foot">가장 오래된 실측값(' + esc(nw.real[0] ? nw.real[0].d : "") + ')에서 달마다 (수입 - 지출)을 빼며 ' +
      BACKFILL_MONTHS + "달만 거꾸로 되짚은 것입니다. 투자 손익과 기록 밖의 돈이 담기지 않아 " +
      "거슬러 올라갈수록 오차가 쌓입니다. 그래서 3년으로 끊었고, 값보다 모양을 보는 그림입니다.</p></div>"
    : "";

  /* 실측과 가계부의 어긋남 */
  let check = "";
  if (nw.real.length >= 2) {
    const a = nw.real[0], b = nw.real[nw.real.length - 1];
    const rs = S.rows.filter(r => r.date >= a.d && r.date <= b.d);
    const flow = sumMine(rs, isIn) - sumMine(rs, isOut);
    const real = b.v - a.v;
    const diff = flow - real;
    check = '<div class="card"><div class="sec"><h2>두 장부가 맞나</h2>' +
      '<span class="hint">' + esc(a.d) + " ~ " + esc(b.d) + "</span></div>" +
      '<div class="rows">' +
      '<div class="row"><div class="nm">가계부 (수입 - 지출)</div><div class="amt">' + won(flow) + "</div></div>" +
      '<div class="row"><div class="nm">자산 시트 원금 증가</div><div class="amt">' + won(real) + "</div></div>" +
      '<div class="row"><div class="nm">어긋난 값</div><div class="amt" style="color:' +
      (Math.abs(diff) / Math.max(1, Math.abs(real)) < .1 ? "var(--in)" : "var(--warn)") + '">' +
      (diff >= 0 ? "+" : "-") + won(Math.abs(diff)) + " (" + (real ? Math.round(Math.abs(diff) / Math.abs(real) * 100) : 0) + "%)</div></div>" +
      "</div>" +
      '<p class="foot">두 파일은 서로를 검산합니다. 차이가 10% 안쪽이면 가계부가 자산 흐름을 거의 다 설명하고 있는 것입니다. ' +
      "차이가 커지면 기록에서 빠진 돈이 있다는 뜻입니다.</p></div>";
  }

  /* 구성 */
  const top = assetTop();
  const tot = assetTotal() || 1;
  const compose = '<div class="card"><div class="sec"><h2>무엇으로 가지고 있나</h2>' +
    '<span class="hint">' + esc(A.data.asOf || "") + " 기준</span></div>" +
    '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
    donut(top.map(t => ({ key: t.name, mine: t.amt })), tot) +
    '<div style="flex:1;min-width:190px"><div class="rows">' + top.map(t =>
      '<div class="row"><div class="nm">' + esc(t.name) + "</div>" +
      '<div class="amt">' + won(t.amt) + "</div>" +
      '<div class="bar"><div class="dbar gold"><i class="mine" style="width:' + (t.amt / tot * 100).toFixed(1) + '%"></i></div></div>' +
      '<div class="meta"><span>' + (t.amt / tot * 100).toFixed(1) + "%</span></div></div>").join("") +
    "</div></div></div>" +
    '<div class="tree" style="margin-top:16px">' +
    (A.data.tree || []).filter(t => t.amt && t.name !== "1").map(t => treeRow(t, true)).join("") +
    "</div></div>";

  /* 예적금 만기 */
  const mt = maturities();
  const mtCard = mt.length
    ? '<div class="card"><div class="sec"><h2>예적금 만기</h2><span class="hint">오늘 ' + todayISO() + "</span></div>" +
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
      "<th>이름</th><th>금액</th><th>금리</th><th>만기</th><th>남은 날</th></tr></thead><tbody>" +
      mt.map(m => {
        const soon = m.days != null && m.days <= 45;
        return '<tr><td class="nm">' + esc(m.name) + '</td><td class="n">' + won(m.amt) +
          '</td><td class="n">' + (m.rate ? (m.rate * 100).toFixed(2) + "%" : "-") + "</td><td>" + esc(m.due || m.note || "-") +
          '</td><td class="n ' + (soon ? (m.days < 0 ? "neg" : "neg") : "") + '">' +
          (m.days == null ? "-" : m.days >= 0 ? m.days + "일" : (-m.days) + "일 지남") + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<div style="height:14px"></div>' + timelineHTML(mt) +
      '<p class="foot">비고 칸의 "26년 8월 만기" 같은 표기를 그대로 읽습니다. 표기를 바꾸면 여기가 비게 되니 형식을 지켜 주세요.</p></div>'
    : "";

  const cb = '<div class="card tight"><div class="sec" style="margin-bottom:6px"><h2>카드 캐시백</h2></div>' +
    '<p class="foot" style="margin:0">캐시백은 별도 앱이 정본입니다. 두 곳에서 관리하면 어긋나므로 여기서는 잇기만 합니다. ' +
    '<a href="' + CONFIG.CARD_APP_URL + '" style="color:var(--navy);font-weight:700">캐시백 앱 열기</a></p></div>';

  box.innerHTML = hero + curve + check + compose + mtCard + cb;
  decorate(box);
}

/* ---------- 2) 투자 ---------- */
function assetInvest() {
  const box = $("#assetBody");
  const t = tradeStat();

  const hero = '<div class="card hero gold"><span class="eyebrow">매매 성적표</span>' +
    '<div class="big">' + (t.closedPnl >= 0 ? "+" : "-") + won(Math.abs(t.closedPnl)) + '<span class="won">원</span></div>' +
    '<div class="sub"><span>종료 <b>' + t.closed.length + "건</b></span>" +
    "<span>이긴 것 <b>" + t.win + " / " + t.closed.length + "</b></span>" +
    "<span>승률 <b>" + Math.round(t.winRate * 100) + "%</b></span>" +
    "<span>진행 <b>" + t.open.length + "건</b></span></div>" +
    '<p class="foot">종료한 거래의 실현 손익입니다. 진행 중인 것의 평가손익은 현황 탭의 지금 값에 들어 있습니다.</p></div>';

  const tbl = (rows, showRet) => '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
    "<th>종목</th><th>구분</th><th>투입</th>" + (showRet ? "<th>손익</th><th>수익률</th><th>보유일</th>" : "<th>시작</th>") +
    "</tr></thead><tbody>" + rows.map(x =>
      '<tr><td class="nm">' + esc(x.name) + "</td><td>" + esc(x.tag || x.catv || "") + '</td><td class="n">' + won(x.cost) + "</td>" +
      (showRet
        ? '<td class="n ' + ((x.pnl || 0) >= 0 ? "pos" : "neg") + '">' + ((x.pnl || 0) >= 0 ? "+" : "-") + won(Math.abs(x.pnl || 0)) + "</td>" +
          '<td class="n ' + ((x.ret || 0) >= 0 ? "pos" : "neg") + '">' + ((x.ret || 0) * 100).toFixed(1) + "%</td>" +
          '<td class="n">' + (x.days || "-") + "</td>"
        : "<td>" + esc(x.start || "") + "</td>") +
      "</tr>").join("") + "</tbody></table></div>";

  const closed = t.closed.slice().sort((a, b) => (b.ret || 0) - (a.ret || 0));
  const closedCard = '<div class="card"><div class="sec"><h2>끝낸 거래</h2><span class="hint">수익률 순</span></div>' +
    (closed.length ? tbl(closed, true) : '<div class="empty">없습니다.</div>') + "</div>";

  const open = t.open.slice().sort((a, b) => (b.cost || 0) - (a.cost || 0));
  const openCard = '<div class="card"><div class="sec"><h2>들고 있는 것</h2>' +
    '<span class="hint">투입 ' + won(t.openCost) + "원</span></div>" +
    (open.length ? tbl(open, false) : '<div class="empty">없습니다.</div>') +
    '<p class="foot">현재가는 시트의 실시간 수식이 만든 값이라, 이 앱은 시트를 마지막으로 연 시점의 값을 봅니다. 장중 시세가 아닙니다.</p></div>';

  const vc = (A.data.vc || []).filter(v => v.cost);
  const vcCard = vc.length
    ? '<div class="card"><div class="sec"><h2>비상장</h2></div>' +
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>이름</th><th>투입</th><th>지금 값</th><th>수익률</th></tr></thead><tbody>' +
      vc.map(v => '<tr><td class="nm">' + esc(v.name) + '</td><td class="n">' + won(v.cost) +
        '</td><td class="n">' + won(v.value) + '</td><td class="n ' + ((v.ret || 0) >= 0 ? "pos" : "neg") + '">' +
        ((v.ret || 0) * 100).toFixed(0) + "%</td></tr>").join("") + "</tbody></table></div>" +
      '<p class="foot">비상장은 마지막 라운드 가치라 언제든 달라집니다. 팔기 전까지는 숫자일 뿐입니다.</p></div>'
    : "";

  /* 분류별 */
  const byTag = new Map();
  for (const x of (A.data.trades || [])) {
    const k = x.catv || x.cat || "기타";
    const o = byTag.get(k) || { key: k, mine: 0, amt: 0, n: 0 };
    o.mine += x.cost || 0; o.amt += x.cost || 0; o.n++; byTag.set(k, o);
  }
  const tags = Array.from(byTag.values()).sort((a, b) => b.mine - a.mine);
  const tagCard = tags.length
    ? '<div class="card"><div class="sec"><h2>무엇에 넣었나</h2><span class="hint">투입액 기준</span></div>' +
      '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' + donut(tags.slice(0, 7)) +
      '<div style="flex:1;min-width:190px">' +
      rankList(tags, tags[0].mine, { color: it => colorOf(it.key), noIcon: true }) + "</div></div></div>"
    : "";

  /* 종목별 손익 */
  const pnlBars = closed.filter(x => x.pnl).slice(0, 14)
    .sort((x, y) => (y.pnl || 0) - (x.pnl || 0))
    .map(x => ({ key: x.name, v: x.pnl, ret: x.ret }));
  const pnlCard = pnlBars.length
    ? '<div class="card"><div class="sec"><h2>무엇에서 벌고 잃었나</h2><span class="hint">끝낸 거래</span></div>' +
      divergeBars(pnlBars, { sub: i => ((i.ret || 0) * 100).toFixed(0) + "%" }) + "</div>"
    : "";

  /* 보유일과 수익률 */
  const sc = closed.filter(x => x.days && x.ret != null)
    .map(x => ({ x: x.days, y: x.ret, r: 3 + Math.min(6, Math.sqrt((x.cost || 0) / 3000000)), t: x.name + " " + Math.round(x.ret * 100) + "%" }));
  const scCard = sc.length >= 4
    ? '<div class="card"><div class="sec"><h2>오래 들수록 나았나</h2><span class="hint">가로는 보유일, 점 크기는 투입액</span></div>' +
      scatterHTML(sc, { h: 180, xmin: "0일", xmax: Math.max(...sc.map(p => p.x)) + "일" }) +
      '<p class="foot">오른쪽 위로 갈수록 오래 들고 많이 번 거래입니다. 점선은 본전입니다.</p></div>'
    : "";

  box.innerHTML = hero + pnlCard + closedCard + scCard + openCard + vcCard + tagCard;
  decorate(box);
}

/* ---------- 3) 수입원 ---------- */
function assetIncome() {
  const box = $("#assetBody");
  const sal = salarySteps();

  const cur = sal.length ? sal[sal.length - 1] : null;
  const first = sal.length ? sal[0] : null;
  const grow = cur && first && first.base ? (cur.base - first.base) / first.base : 0;

  const hero = '<div class="card hero gold"><span class="eyebrow">지금 계약 연봉</span>' +
    '<div class="big">' + (cur ? won(cur.base) : "-") + '<span class="won">원</span></div>' +
    '<div class="sub">' + (cur ? "<span>" + esc(cur.company) + " <b>" + esc(cur.date) + "</b></span>" : "") +
    (first ? "<span>첫 연봉 대비 <b>+" + Math.round(grow * 100) + "%</b></span>" : "") +
    "<span>단계 <b>" + sal.length + "</b></span></div></div>";

  const curve = sal.length
    ? '<div class="card"><div class="sec"><h2>연봉 곡선</h2><span class="hint">계약 연봉이 바뀐 시점</span></div>' +
      lineChart([{ color: "var(--gold)", dot: true, w: 2.4, pts: sal.map(s => ({ x: s.date, y: s.base })) }],
        { h: 160, zero: false, label: x => x.slice(2, 7) }) +
      '<div style="overflow-x:auto;margin-top:12px"><table class="tbl"><thead><tr>' +
      "<th>회사</th><th>일시</th><th>계약 연봉</th><th>인상</th><th>사유</th></tr></thead><tbody>" +
      sal.slice().reverse().map(s =>
        '<tr><td class="nm">' + esc(s.company) + "</td><td>" + esc(s.date) + '</td><td class="n">' + won(s.base) +
        '</td><td class="n ' + ((s.raise || 0) > 0 ? "pos" : "") + '">' + (s.raise ? "+" + (s.raise * 100).toFixed(1) + "%" : "-") +
        "</td><td>" + esc(s.reason || "") + "</td></tr>").join("") +
      "</tbody></table></div></div>"
    : "";

  /* 사이드 인컴 */
  const side = sideByYear();
  const sideCard = side.length
    ? '<div class="card"><div class="sec"><h2>본업 밖의 수입</h2><span class="hint">자산 시트의 사이드잡</span></div>' +
      barsHTML(side.slice().reverse().map(s => ({ key: String(s.year).slice(2), mine: s.total, color: "var(--in)" })), {}) +
      '<div class="rows" style="margin-top:12px">' + side.map(s =>
        '<div class="row"><div class="nm">' + s.year + "년</div>" +
        '<div class="amt">' + won(s.total) + "</div>" +
        '<div class="meta">' + s.items.slice(0, 4).map(i =>
          "<span>" + esc(i.src) + " " + wonS(i.total) + "</span>").join("") + "</div></div>").join("") + "</div>" +
      '<p class="foot">이 값은 가계부 수입과 겹칩니다. 더하지 마세요. ' +
      "황금여행사분은 가계부에 급여로, 멘토링분은 부수입으로 이미 들어가 있습니다. " +
      "여기서는 그 수입이 어느 수입원에서 왔는지만 보는 표입니다.</p></div>"
    : "";

  /* 가계부 쪽 수입 */
  const ys = years().filter(y => y <= yOf(todayISO()));
  const incByYear = ys.map(y => {
    const rs = S.rows.filter(r => r.y === y && isIn(r));
    return { y, total: sumMine(rs), byS: byKey(rs, r => r.sub) };
  }).reverse();
  const ledgerCard = '<div class="card"><div class="sec"><h2>가계부에 적힌 수입</h2>' +
    '<span class="hint">이쪽이 실제로 들어온 돈</span></div>' +
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>해</th><th>합계</th><th>급여</th><th>부수입</th><th>그 밖</th></tr></thead><tbody>' +
    incByYear.map(r => {
      const g = k => (r.byS.find(x => x.key === k) || { mine: 0 }).mine;
      return "<tr><td>" + r.y + '</td><td class="n">' + won(r.total) + '</td><td class="n">' + won(g("급여")) +
        '</td><td class="n">' + won(g("부수입")) + '</td><td class="n">' + won(r.total - g("급여") - g("부수입")) + "</td></tr>";
    }).join("") + "</tbody></table></div>" +
    '<p class="foot">계약 연봉은 약속한 금액이고, 이 표는 통장에 들어온 금액입니다. 상여와 환급이 섞여 있어 둘은 다릅니다.</p></div>';

  /* 수입 구성이 해마다 어떻게 바뀌었나 */
  const ys2 = years().filter(y2 => y2 <= yOf(todayISO()));
  const incKeys = ["급여", "부수입", "환급/보상", "중고거래", "금융소득", "받은돈"];
  const incCache = new Map();
  const getInc = (y2, k) => {
    if (!incCache.has(y2)) {
      const o = {};
      for (const r of S.rows) if (r.y === y2 && isIn(r)) o[r.sub] = (o[r.sub] || 0) + r.mine;
      incCache.set(y2, o);
    }
    return incCache.get(y2)[k] || 0;
  };
  const mixCard = ys2.length
    ? '<div class="card"><div class="sec"><h2>수입이 어디서 왔나</h2><span class="hint">해마다 쌓아서</span></div>' +
      stackHTML(ys2, incKeys, getInc, { h: 175 }) + "</div>"
    : "";

  box.innerHTML = hero + curve + mixCard + sideCard + ledgerCard;
  decorate(box);
}

/* page-hall.js - 기록실. 테마와 명예의 전당. */
FILEV.hall = CONFIG.APP_VERSION;

const HL = { seg: "theme" };

function renderHall() {
  const box = $("#p-hall");
  box.innerHTML = segHTML([["theme", "테마"], ["fame", "명예의 전당"]], HL.seg, "hl") +
    '<div id="hallBody"></div>';
  $$("[data-hl]", box).forEach(b => b.onclick = () => { HL.seg = b.dataset.hl; renderHall(); });
  if (HL.seg === "fame") renderFame();
  else renderTheme();
  decorate(box);
}

function renderFame() {
  const box = $("#hallBody");
  const all = S.rows.filter(r => r.date <= todayISO());
  const outs = all.filter(isOut);
  const first = all.length ? all[0].date : todayISO();
  const days = Math.max(1, Math.round((new Date(todayISO()) - new Date(first)) / 86400000) + 1);
  const places = byKey(outs, r => (r.place || "").trim());
  const totIn = sumMine(all, isIn), totOut = sumMine(all, isOut);

  const hero = '<div class="card hero"><span class="eyebrow">' + first.replace(/-/g, ".") + " 부터</span>" +
    '<div class="big">' + won(days) + '<span class="won">일째</span></div>' +
    '<div class="sub"><span>기록 <b>' + won(all.length) + "건</b></span>" +
    "<span>다녀간 곳 <b>" + won(places.length) + "곳</b></span>" +
    "<span>누적 수입 <b>" + wonS(totIn) + "</b></span>" +
    "<span>누적 지출 <b>" + wonS(totOut) + "</b></span>" +
    "<span>남은 몫 <b>" + wonS(totIn - totOut) + "</b></span></div></div>";

  /* 기록 */
  const dm = dayMap();
  const maxDay = Array.from(dm.entries()).sort((a, b) => b[1] - a[1])[0];
  const ms = Array.from(new Set(all.map(r => r.ym))).filter(m => m && m < ymOf(todayISO())).sort();
  let bestSave = null, worstOut = null;
  for (const m of ms) {
    const st = monthStat(m);
    if (st.inc >= 1000000) { const r = (st.inc - st.out) / st.inc; if (!bestSave || r > bestSave.r) bestSave = { ym: m, r, st }; }
    if (!worstOut || st.out > worstOut.out) worstOut = { ym: m, out: st.out };
  }
  const recCard = '<div class="card"><div class="sec"><h2>기록</h2><span class="hint">끝난 달만</span></div><div class="rows">' +
    [
      maxDay ? ["가장 많이 쓴 하루", maxDay[0] + " " + wdOf(maxDay[0]) + "요일", won(maxDay[1])] : null,
      worstOut ? ["가장 많이 쓴 달", worstOut.ym, won(worstOut.out)] : null,
      bestSave ? ["저축률이 가장 높던 달", bestSave.ym + " 수입 " + wonS(bestSave.st.inc), Math.round(bestSave.r * 100) + "%"] : null,
    ].filter(Boolean).map(([k, m, v]) =>
      '<div class="row"><div class="nm">' + esc(k) + '</div><div class="amt">' + esc(v) + "</div>" +
      '<div class="meta"><span>' + esc(m) + "</span></div></div>").join("") + "</div></div>";

  /* 큰 지출 열 개 */
  const top = outs.slice().sort((a, b) => b.mine - a.mine).slice(0, 10);
  const topCard = '<div class="card"><div class="sec"><h2>가장 큰 지출 열 개</h2><span class="hint">내 몫 기준</span></div>' +
    '<div class="rows">' + top.map((r, i) =>
      '<div class="row"><div class="nm"><span class="num" style="color:var(--ink3);font-size:11px;margin-right:6px">' +
      pad2(i + 1) + "</span>" + esc(r.place || r.sub) + "</div>" +
      '<div class="amt">' + won(r.mine) + "</div>" +
      '<div class="meta"><span>' + r.date + "</span><span>" + esc(r.sub) + "</span>" +
      (r.detail ? "<span>" + esc(r.detail) + "</span>" : "") + "</div></div>").join("") + "</div></div>";

  /* 단골 */
  const reg = places.filter(p => p.key && !/지하철|버스|생활비|여행계|후불/.test(p.key))
    .sort((a, b) => b.n - a.n).slice(0, 12);
  const regCard = '<div class="card"><div class="sec"><h2>단골</h2><span class="hint">간 횟수 순</span></div>' +
    rankList(reg.map(p => ({ key: p.key, mine: p.mine, amt: p.amt, n: p.n })), reg[0] && reg[0].mine,
      { extra: it => "건당 " + won(Math.round(it.mine / it.n)) }) + "</div>";

  /* 효도 */
  const par = outs.filter(r => r.treat === "부모님");
  const parY = byKey(par, r => r.y).sort((a, b) => a.key < b.key ? -1 : 1);
  const parCard = par.length
    ? '<div class="card"><div class="sec"><h2>부모님께</h2><span class="hint">대접 칸이 부모님인 기록</span></div>' +
      '<div class="hero" style="margin-bottom:12px"><div class="big" style="font-size:30px">' + won(sumMine(par)) +
      '<span class="won">원</span></div><div class="sub"><span>' + par.length + "건</span>" +
      "<span>용돈 <b>" + wonS(sumMine(par, r => r.sub === "용돈")) + "</b></span>" +
      "<span>선물 <b>" + wonS(sumMine(par, r => r.sub === "선물")) + "</b></span>" +
      "<span>함께 먹은 것 <b>" + wonS(sumMine(par, r => r.sub !== "용돈" && r.sub !== "선물")) + "</b></span></div></div>" +
      barsHTML(parY.map(y => ({ key: y.key.slice(2), mine: y.mine, color: "var(--gold)" })), { h: 120 }) +
      '<p class="foot">현금 용돈과 물건 선물과 함께한 밥이 한 표에서 합쳐집니다. 업종은 그대로 두고 대접 칸으로 모으기 때문입니다.</p></div>'
    : "";

  /* 숨은 절약 */
  /* 할인 칸에 적힌 것이 정본이다. 그 칸이 비어 있던 시절 것만 메모에서 줍는다 */
  const hard = all.filter(r => r.disc > 0);
  const soft = all.filter(r => !r.disc && SAVE_RE.test((r.memo || "") + " " + (r.detail || "")));
  const sv = hard.concat(soft);
  let svSum = hard.reduce((a, r) => a + r.disc, 0);
  for (const r of soft) {
    const m = ((r.memo || "") + " " + (r.detail || "")).match(/([\d,]{3,})\s*원?/);
    if (m) { const v = +m[1].replace(/,/g, ""); if (v >= 100 && v <= 500000) svSum += v; }
  }
  const svY = byKey(sv, r => r.y).sort((a, b) => a.key < b.key ? -1 : 1);
  const svCard = sv.length
    ? '<div class="card"><div class="sec"><h2>숨은 절약</h2><span class="hint">메모와 세부내역에서 찾은 것</span></div>' +
      '<div class="rows"><div class="row"><div class="nm">할인 캐시백을 챙긴 기록</div>' +
      '<div class="amt">' + won(sv.length) + "건</div></div>" +
      '<div class="row"><div class="nm">할인 칸에 적힌 것</div><div class="amt">' + won(hard.length) + "건 " +
      wonS(hard.reduce((a, r) => a + r.disc, 0)) + "</div></div>" +
      '<div class="row"><div class="nm">모두 더하면</div><div class="amt">' + won(svSum) + "</div></div></div>" +
      '<div style="height:10px"></div>' +
      barsHTML(svY.map(y => ({ key: y.key.slice(2), mine: y.n, color: "var(--in)" })), { h: 100 }) +
      '<p class="foot">할인 칸에 적은 것은 정확하고, 메모에서 주운 것은 어림값입니다. 앞으로는 할인 칸에 적으면 이 숫자가 정확해집니다. 막대는 건수입니다.</p></div>'
    : "";

  box.innerHTML = hero + recCard + topCard + regCard + parCard + svCard;
  decorate(box);
}

/* ===== js/page-theme.js ===== */
/* page-theme.js - 카테고리를 가로지르는 주제. 여행, 부모님, 용돈, 연인, 소개팅, 동생, 일시성. */
FILEV.theme = CONFIG.APP_VERSION;

const TH = { id: "여행", span: "all" };

function renderTheme() {
  const box = $("#hallBody");
  const chips = '<div class="chips">' + THEMES.map(t =>
    '<button class="chip' + (TH.id === t.id ? " on" : "") + '" data-t="' + t.id + '">' + t.name + "</button>").join("") + "</div>";

  const t = THEMES.find(x => x.id === TH.id);
  let rs = themeRows(TH.id);
  const spanChips = '<div class="chips">' +
    [["all", "전체 기간"], ["y", "올해"], ["12", "최근 열두 달"]].map(([k, n]) =>
      '<button class="chip' + (TH.span === k ? " on" : "") + '" data-s="' + k + '">' + n + "</button>").join("") + "</div>";
  if (TH.span === "y") rs = rs.filter(r => r.y === yOf(S.ym + "-01"));
  if (TH.span === "12") { const ms = Array.from({ length: 12 }, (_, i) => shiftYM(S.ym, -(11 - i))); rs = rs.filter(r => ms.includes(r.ym)); }

  const mine = rs.reduce((a, r) => a + r.mine, 0);
  const full = rs.reduce((a, r) => a + r.amt, 0);
  const yrs = byKey(rs, r => r.y).sort((a, b) => a.key < b.key ? -1 : 1);
  const subs = byKey(rs, r => r.sub).slice(0, 10);
  const who = byKey(rs, r => r.treat).slice(0, 8);
  const withWho = byKey(rs, r => (r.with || "").trim()).slice(0, 12);
  const top = rs.slice().sort((a, b) => b.mine - a.mine).slice(0, 10);

  const head =
    '<div class="card hero"><span class="eyebrow">' + esc(t.name) + "</span>" +
    '<div class="big">' + won(mine) + '<span class="won">원</span></div>' +
    '<div class="sub"><span>전액 <b>' + won(full) + "</b></span><span>" + rs.length + "건</span>" +
    (rs.length ? "<span>" + rs[0].date.slice(0, 7) + " 부터 " + rs[rs.length - 1].date.slice(0, 7) + "</span>" : "") +
    "</div>" +
    '<p style="font-size:11.5px;color:var(--ink3);margin:10px 0 0">' + esc(t.desc) + "</p></div>";

  if (!rs.length) { box.innerHTML = chips + spanChips + head + '<div class="card"><div class="empty">이 주제로 잡힌 기록이 없습니다.<br>입력할 때 테마 칸을 적어 두면 여기에 모입니다.</div></div>'; bindTheme(box); return; }

  const byYear = '<div class="card"><div class="sec"><h2>해마다</h2></div>' +
    sparkMonths(yrs.map(y => ({ ym: y.key + "-01", label: y.key.slice(2), out: y.mine })), {}) +
    '<div class="rows" style="margin-top:12px">' + yrs.slice().reverse().map(y =>
      '<div class="row"><div class="nm">' + y.key + "년</div><div class=\"amt\">" + won(y.mine) + "</div>" +
      '<div class="meta"><span>' + y.n + "건</span></div></div>").join("") + "</div></div>";

  const subCard = '<div class="card"><div class="sec"><h2>무엇에</h2></div>' +
    rankList(subs, subs[0].mine, { extra: it => "건당 " + won(Math.round(it.mine / it.n)) }) + "</div>";

  const whoCard = who.length ? '<div class="card"><div class="sec"><h2>누구에게</h2></div>' + rankList(who, who[0].mine, {}) + "</div>" : "";
  const withCard = withWho.length ? '<div class="card"><div class="sec"><h2>누구와</h2>' +
    '<span class="hint">동행 칸에 적힌 사람</span></div>' +
    rankList(withWho, withWho[0].mine, {}) + "</div>" : "";

  const topCard = '<div class="card"><div class="sec"><h2>큰 기록</h2></div><div class="rows">' + top.map(r =>
    '<div class="row"><div class="nm">' + esc(r.place || r.sub) + "</div>" +
    '<div class="amt">' + won(r.mine) + "</div>" +
    '<div class="meta"><span>' + r.date + "</span><span>" + esc(r.sub) + "</span>" +
    (r.detail ? "<span>" + esc(r.detail) + "</span>" : "") + "</div></div>").join("") + "</div></div>";

  const romance = (TH.id === "소개팅" || TH.id === "연인") ? romanceHTML(TH.id) : "";
  box.innerHTML = chips + spanChips + head + romance + byYear + withCard + subCard + whoCard + topCard;
  decorate(box);
  bindTheme(box);
}

function bindTheme(box) {
  $$("[data-t]", box).forEach(c => c.onclick = () => { TH.id = c.dataset.t; renderTheme(); });
  $$("[data-s]", box).forEach(c => c.onclick = () => { TH.span = c.dataset.s; renderTheme(); });
}



/* ---------- 소개팅과 연애 인포그래픽 ----------
   가계부에는 없고 이력 시트에만 있는 것(소개 루트, 주선자, 연애로 이어졌나)을 끌어온다.
   두 장부를 이름으로 이어 붙여야 비로소 보이는 것들이다. */
function romanceHTML(which) {
  const P = S.people || { intro: [], love: [] };
  const isIntro = which === "소개팅";
  const raw = isIntro ? (P.intro || []) : (P.love || []);
  /* 이력 시트에는 앱 과금도 한 줄씩 들어 있다. 사람 수에 섞이면 안 되니 갈라 둔다 */
  const apps = raw.filter(x => x.kind === "앱 과금");
  const list = raw.filter(x => x.kind !== "앱 과금");
  if (!list.length && !apps.length) return "";

  const spentOf = nm => {
    const rs = S.rows.filter(r => isOut(r) && (r.with || "").split(/[,;\/]/).map(x => x.trim()).indexOf(nm) >= 0);
    return { mine: rs.reduce((a, r) => a + r.mine, 0), n: rs.length };
  };

  /* 1) 한눈에 */
  const met = list.filter(x => x.n > 0 || x.first);
  const toLove = list.filter(x => (x.next || "").indexOf("연애") >= 0);
  const each = list.map(x => {
    const nm = x.with || x.name;
    return x.mine ? { mine: x.mine, cnt: x.cnt } : spentOf(nm);
  });
  const totalMine = each.reduce((a, x) => a + (x.mine || 0), 0);
  const totalCnt = each.reduce((a, x) => a + (x.n || x.cnt || 0), 0);
  const paidN = each.filter(x => x.mine > 0).length;
  const hero =
    '<div class="card"><div class="sec"><h2>' + (isIntro ? "소개팅 이력" : "연애 이력") + "</h2>" +
    '<span class="hint">이력 시트에서 끌어옴</span></div>' +
    '<div class="rows">' +
    '<div class="row"><div class="nm">' + (isIntro ? "만난 사람" : "만난 사람") + "</div>" +
    '<div class="amt">' + list.length + "명</div></div>" +
    (isIntro ? '<div class="row"><div class="nm">연애로 이어짐</div><div class="amt">' + toLove.length +
      "명 (" + Math.round(toLove.length / list.length * 100) + "%)</div></div>" : "") +
    '<div class="row"><div class="nm">쓴 돈</div><div class="amt">' + won(totalMine) + "</div></div>" +
    '<div class="row"><div class="nm">한 사람당</div><div class="amt">' +
    won(Math.round(totalMine / Math.max(1, paidN))) + "</div></div>" +
    '<div class="row"><div class="nm">돈을 쓴 사람</div><div class="amt">' + paidN + "명</div></div>" +
    (totalCnt ? '<div class="row"><div class="nm">건당</div><div class="amt">' +
      won(Math.round(totalMine / totalCnt)) + "</div></div>" : "") +
    "</div></div>";

  /* 1.5) 앱에 쓴 돈. 사람에게 쓴 돈과 나란히 놓아야 뜻이 있다 */
  const appTot = apps.reduce((a, x) => a + (x.mine || x.spent || 0), 0);
  const appCnt = apps.reduce((a, x) => a + (x.cnt || 0), 0);
  const viaApp = list.filter(x => x.route === "앱").length;
  const appCard = apps.length
    ? '<div class="card"><div class="sec"><h2>앱에 쓴 돈</h2>' +
      '<span class="hint">사람에게 쓴 돈과 별개</span></div>' +
      '<div class="rows">' + apps.slice().sort((a, b) => (b.mine || 0) - (a.mine || 0)).map(x =>
        '<div class="row"><div class="nm">' + esc(x.name) + "</div>" +
        '<div class="amt">' + won(x.mine || x.spent || 0) + "</div>" +
        '<div class="bar"><div class="dbar"><i class="mine" style="width:' +
        ((x.mine || 0) / Math.max(1, appTot) * 100).toFixed(1) + '%;background:var(--sky)"></i></div></div>' +
        '<div class="meta"><span>' + (x.cnt || 0) + "번 결제</span>" +
        (x.cnt ? "<span>한 번에 " + won(Math.round((x.mine || 0) / x.cnt)) + "</span>" : "") +
        (x.first ? "<span>" + esc(x.first) + " 부터</span>" : "") + "</div></div>").join("") +
      "</div>" +
      '<div class="rows" style="margin-top:12px;border-top:1px solid var(--line2);padding-top:12px">' +
      '<div class="row"><div class="nm">앱에 쓴 돈</div><div class="amt">' + won(appTot) + "</div></div>" +
      '<div class="row"><div class="nm">사람에게 쓴 돈</div><div class="amt">' + won(totalMine) + "</div></div>" +
      (viaApp ? '<div class="row"><div class="nm">앱으로 만난 사람</div><div class="amt">' + viaApp + "명</div></div>" +
        '<div class="row"><div class="nm">한 사람 만나는 데 든 앱 값</div><div class="amt">' +
        won(Math.round(appTot / viaApp)) + "</div></div>" : "") +
      "</div>" +
      '<p class="foot">앱 과금은 [소개팅 이력] 시트에 앱 이름으로 한 줄씩 들어 있고 구분이 앱 과금 입니다. ' +
      "위의 사람 수와 사람에게 쓴 돈에는 섞이지 않습니다.</p></div>"
    : "";

  /* 2) 어떻게 만났나 */
  const byRoute = new Map();
  list.forEach(x => {
    const k = x.route || "미기재";
    const o = byRoute.get(k) || { key: k, mine: 0, amt: 0, n: 0, love: 0 };
    o.n++; o.mine += x.mine || 0; o.amt += x.mine || 0;
    if ((x.next || "").indexOf("연애") >= 0) o.love++;
    byRoute.set(k, o);
  });
  const routes = Array.from(byRoute.values()).sort((a, b) => b.n - a.n);
  const routeCard =
    '<div class="card"><div class="sec"><h2>어떻게 만났나</h2><span class="hint">사람 수 기준</span></div>' +
    '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
    donut(routes.map(r => ({ key: r.key, mine: r.n }))) +
    '<div style="flex:1;min-width:190px"><div class="rows">' + routes.map(r =>
      '<div class="row"><div class="nm">' + esc(r.key) + "</div>" +
      '<div class="amt">' + r.n + "명</div>" +
      '<div class="bar"><div class="dbar"><i class="mine" style="width:' +
      (r.n / routes[0].n * 100).toFixed(1) + "%;background:" + colorOf(r.key) + '"></i></div></div>' +
      '<div class="meta"><span>' + Math.round(r.n / list.length * 100) + "%</span>" +
      (isIntro ? "<span>연애로 " + r.love + "명 (" + Math.round(r.love / Math.max(1, r.n) * 100) + "%)</span>" : "") +
      (r.mine ? "<span>쓴 돈 " + wonS(r.mine) + "</span>" : "") + "</div></div>").join("") +
    "</div></div></div></div>";

  /* 3) 누가 이어 줬나 */
  const byMaker = new Map();
  list.forEach(x => {
    const k = (x.maker || "").trim();
    if (!k) return;
    const o = byMaker.get(k) || { key: k, mine: 0, amt: 0, n: 0, love: 0 };
    o.n++; o.mine += x.mine || 0; o.amt += x.mine || 0;
    if ((x.next || "").indexOf("연애") >= 0) o.love++;
    byMaker.set(k, o);
  });
  const makers = Array.from(byMaker.values()).sort((a, b) => b.n - a.n).slice(0, 12);
  const makerCard = makers.length
    ? '<div class="card"><div class="sec"><h2>누가 이어 줬나</h2><span class="hint">주선자와 앱</span></div>' +
      rankList(makers.map(m => ({ key: m.key, mine: m.n, amt: m.n, n: m.n, love: m.love, spent: m.mine })),
        makers[0].n, {
        val: it => it.n + "명", unit: "명", noIcon: true, color: () => "var(--sky)",
        extra: it => (it.love ? "연애 " + it.love + "명" : "") + (it.spent ? " 쓴 돈 " + wonS(it.spent) : ""),
      }) + "</div>"
    : "";

  /* 4) 해마다 */
  const byYear = new Map();
  list.forEach(x => {
    const y = (x.first || x.start || "").slice(0, 4);
    if (!y) return;
    const o = byYear.get(y) || { key: y, n: 0, love: 0 };
    o.n++; if ((x.next || "").indexOf("연애") >= 0) o.love++;
    byYear.set(y, o);
  });
  const yrs = Array.from(byYear.values()).sort((a, b) => a.key < b.key ? -1 : 1);
  const yearCard = yrs.length
    ? '<div class="card"><div class="sec"><h2>해마다 몇 명</h2><span class="hint">첫 만남 기준</span></div>' +
      barsHTML(yrs.map(y => ({ key: y.key.slice(2), mine: y.n, color: "var(--coral)" })), { h: 120 }) +
      '<div class="legend"><span>모두 ' + list.length + "명</span>" +
      (isIntro ? "<span>연애로 이어진 해 " + yrs.filter(y => y.love).length + "개</span>" : "") + "</div></div>"
    : "";

  /* 5) 몇 번 만났나 */
  const buckets = [["1번", x => x.n <= 1], ["2번", x => x.n === 2], ["3번", x => x.n === 3],
                   ["4-5번", x => x.n >= 4 && x.n <= 5], ["6번 이상", x => x.n >= 6]];
  const withN = list.filter(x => x.n > 0);
  const meetCard = withN.length
    ? '<div class="card"><div class="sec"><h2>몇 번 만났나</h2><span class="hint">' + withN.length + "명</span></div>" +
      barsHTML(buckets.map(([k, f]) => ({ key: k, mine: withN.filter(f).length, color: "var(--gold)" })), { h: 115 }) +
      '<p class="foot">한 번 보고 끝난 사람이 ' + withN.filter(x => x.n <= 1).length + "명, 세 번 넘게 본 사람이 " +
      withN.filter(x => x.n > 3).length + "명입니다.</p></div>"
    : "";

  /* 6) 사람별 */
  const rows = list.map(x => {
    const nm = x.with || x.name;
    const s = x.mine ? { mine: x.mine, n: x.cnt } : spentOf(nm);
    return { name: nm, route: x.route, maker: x.maker, first: x.first || x.start,
             met: x.n, mine: s.mine, cnt: s.n, next: x.next, days: x.days };
  }).filter(x => x.mine > 0).sort((a, b) => b.mine - a.mine).slice(0, 15);
  const tblCard = rows.length
    ? '<div class="card"><div class="sec"><h2>사람별</h2><span class="hint">쓴 돈 순 열다섯</span></div>' +
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
      "<th>이름</th><th>루트</th><th>주선자</th><th>첫 만남</th>" +
      (isIntro ? "<th>만남</th>" : "<th>교제일</th>") + "<th>쓴 돈</th><th>건당</th></tr></thead><tbody>" +
      rows.map(x =>
        '<tr><td class="nm">' + esc(x.name) + ((x.next || "").indexOf("연애") >= 0 ? " (연애)" : "") + "</td>" +
        "<td>" + esc(x.route || "") + "</td><td>" + esc(x.maker || "") + "</td>" +
        "<td>" + esc(x.first || "") + '</td><td class="n">' + (isIntro ? (x.met || "") : (x.days || "")) + "</td>" +
        '<td class="n">' + won(x.mine) + '</td><td class="n">' + won(Math.round(x.mine / Math.max(1, x.cnt))) + "</td></tr>").join("") +
      "</tbody></table></div>" +
      '<p class="foot">이름이 [입력] 시트의 동행 칸과 똑같아야 이 표에 금액이 잡힙니다. 비어 있으면 이름을 맞춰 주세요.</p></div>'
    : "";

  return hero + appCard + routeCard + makerCard + yearCard + meetCard + tblCard;
}


/* ===== js/story.js ===== */
/* story.js - 월말 결산 카드. 외부 라이브러리 없이 canvas 에 직접 그려 png 로 내려받는다. */
FILEV.story = CONFIG.APP_VERSION;

function storyLines(ym) {
  const st = monthStat(ym), prev = monthStat(shiftYM(ym, -1));
  const rs = monthRows(ym), outs = rs.filter(isOut);
  const bigs = byKey(outs, r => r.big || "기타");
  const top = outs.slice().sort((a, b) => b.mine - a.mine)[0];
  const d = prev.out ? (st.out - prev.out) / prev.out : null;
  return {
    title: ym.slice(0, 4) + "년 " + (+ym.slice(5, 7)) + "월",
    out: st.out, inc: st.inc, left: st.left,
    rate: st.inc ? Math.round(st.left / st.inc * 100) : null,
    n: rs.length,
    delta: d == null ? "" : (d > 0 ? "지난달보다 " + Math.round(d * 100) + "% 더 썼습니다" : "지난달보다 " + Math.round(-d * 100) + "% 아꼈습니다"),
    bigs: bigs.slice(0, 4),
    top: top ? (top.place || top.sub) + " " + won(top.mine) + "원" : "",
  };
}

function openStory(ym) {
  const s = storyLines(ym);
  openModal(
    '<h2 style="font-size:16px;margin-bottom:2px">' + esc(s.title) + " 결산 카드</h2>" +
    '<p style="font-size:11.5px;color:var(--ink3);margin:0 0 14px">그림으로 내려받아 남겨 둘 수 있습니다.</p>' +
    '<canvas id="stCv" width="540" height="960" style="width:100%;border-radius:12px;border:1px solid var(--line)"></canvas>' +
    '<div style="display:flex;gap:8px;margin-top:14px">' +
    '<button class="btn" id="stDl">그림으로 받기</button>' +
    '<button class="btn ghost" id="stNo" style="max-width:96px">닫기</button></div>'
  );
  drawStory($("#stCv"), s);
  $("#stNo").onclick = () => closeModal(true);
  $("#stDl").onclick = () => {
    try {
      const a = document.createElement("a");
      a.download = "결산_" + ym + ".png";
      a.href = $("#stCv").toDataURL("image/png");
      a.click();
    } catch (e) { toast("이 브라우저에서는 저장이 막혀 있습니다"); }
  };
}

function drawStory(cv, s) {
  const g = cv.getContext("2d");
  if (!g) return;
  const W = cv.width, H = cv.height;
  const night = document.body.classList.contains("night");
  const bg = night ? "#0E1219" : "#1F3864", ink = "#FFFFFF", mut = night ? "#8B94A3" : "#B9C6DE";
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(0, 0, W, 300);

  const F = (sz, w) => (w || 400) + " " + sz + 'px Pretendard, "Apple SD Gothic Neo", sans-serif';
  const M = (sz, w) => (w || 600) + " " + sz + 'px "IBM Plex Mono", monospace';

  g.fillStyle = mut; g.font = F(20, 500); g.fillText("주현 장부", 44, 80);
  g.fillStyle = ink; g.font = F(46, 700); g.fillText(s.title, 44, 140);
  g.fillStyle = mut; g.font = F(19, 400); g.fillText("한 달 결산", 44, 176);

  g.fillStyle = mut; g.font = F(18, 500); g.fillText("쓴 돈", 44, 250);
  g.fillStyle = ink; g.font = M(62, 700); g.fillText(won(s.out), 44, 316);
  g.font = F(20, 400); g.fillStyle = mut; g.fillText("원", 46 + g.measureText("").width + 0, 316);

  g.fillStyle = mut; g.font = F(18, 400);
  g.fillText(s.delta || "", 44, 360);

  let y = 430;
  const line = (k, v) => {
    g.fillStyle = mut; g.font = F(19, 400); g.fillText(k, 44, y);
    g.fillStyle = ink; g.font = M(24, 600);
    const t = v; g.fillText(t, W - 44 - g.measureText(t).width, y);
    g.strokeStyle = "rgba(255,255,255,.12)"; g.beginPath(); g.moveTo(44, y + 16); g.lineTo(W - 44, y + 16); g.stroke();
    y += 56;
  };
  line("번 돈", won(s.inc));
  line("남은 돈", won(s.left));
  if (s.rate != null) line("저축률", s.rate + "%");
  line("기록", s.n + "건");

  y += 24;
  g.fillStyle = mut; g.font = F(18, 500); g.fillText("어디에 썼나", 44, y); y += 34;
  const mx = Math.max(1, ...s.bigs.map(b => b.mine));
  for (const b of s.bigs) {
    g.fillStyle = ink; g.font = F(20, 600); g.fillText(b.key, 44, y);
    g.font = M(19, 500); const t = won(b.mine);
    g.fillText(t, W - 44 - g.measureText(t).width, y);
    y += 14;
    g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(44, y, W - 88, 8);
    g.fillStyle = "#E4788C"; g.fillRect(44, y, (W - 88) * (b.mine / mx), 8);
    y += 40;
  }

  if (s.top) {
    y += 12;
    g.fillStyle = mut; g.font = F(18, 500); g.fillText("가장 큰 한 건", 44, y); y += 34;
    g.fillStyle = ink; g.font = F(23, 600); g.fillText(s.top, 44, y);
  }

  g.fillStyle = mut; g.font = F(15, 400);
  g.fillText("금액은 모두 내 몫 기준입니다", 44, H - 52);
}
