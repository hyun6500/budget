<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>주현 장부</title>
<!-- 한 파일판 v2. 고칠 때는 /* ===== js/xxx.js ===== */ 구획을 찾으세요.
     v1(가계부) + 과거 financial(자산관리) 를 합친 판입니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 주현 장부 - 디자인 토큰
   심야 잉크 바탕에 샴페인 골드(자산), 제이드(수입), 코랄(지출), 스카이(이체).
   금액은 언제나 두 겹으로 그린다. 채운 부분이 내 몫, 빗금이 전액. */
:root{
  --bg:#0B0E14; --bg2:#10141D;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075);
  --solid:#151A24;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.05); --soft:rgba(255,255,255,.05);
  --ink:#EDEFF4; --ink2:#8B93A7; --ink3:#5B6378;
  --navy:#7FB4F2; --navy2:#A6CCFA;
  --gold:#E6C97F; --jade:#57D6A9; --coral:#F87B6B; --sky:#7FB4F2;
  --out:var(--coral); --in:var(--jade); --mov:var(--sky);
  --warn:#E0A85C;
  --r:18px; --r2:12px;
  --sh:0 12px 40px rgba(0,0,0,.45);
  --font:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --num:"Space Grotesk",Pretendard,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --serif:"Gowun Batang",serif;
}
body.day{
  --bg:#F3F4F8; --bg2:#FFFFFF;
  --card:#FFFFFF; --card2:#FFFFFF; --solid:#FFFFFF;
  --line:rgba(15,23,42,.09); --line2:rgba(15,23,42,.055); --soft:#EFF2F7;
  --ink:#171C28; --ink2:#5B6378; --ink3:#98A0B2;
  --navy:#1F3864; --navy2:#33518A;
  --gold:#9A7B2E; --jade:#0F7B6C; --coral:#C0405C; --sky:#4A6FA8;
  --warn:#B4690E;
  --sh:0 1px 2px rgba(18,24,38,.05), 0 10px 28px -14px rgba(18,24,38,.22);
}

/* [중요] hidden 속성이 아래 display 규칙에 지지 않게 못을 박는다.
   이걸 빼면 모달이 화면 위에 깔려 클릭이 전부 막힌다. 두 번 데었다. */
[hidden]{display:none !important}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 460px at 80% -8%, rgba(127,180,242,.10), transparent 60%),
             radial-gradient(700px 380px at 0% 4%, rgba(230,201,127,.07), transparent 62%);
}
body.day::before{opacity:.5}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:var(--sky)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-family:var(--serif);font-size:11px;letter-spacing:.2em;color:var(--ink3);display:block}

/* 프라이버시 블러 */
body.hush .big,body.hush .amt,body.hush .money,body.hush .tbl td.n,body.hush .tree .amt{
  filter:blur(8px);user-select:none;pointer-events:none;
}

/* ---------- 상단 ---------- */
#top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg,var(--bg) 68%,transparent);
}
#top h1{font-size:23px;margin-top:3px}
.topact{display:flex;gap:5px}
.icobtn{
  border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:999px;padding:7px 11px;font-size:11.5px;font-weight:600;
  backdrop-filter:blur(8px);transition:.15s;
}
.icobtn.open{background:var(--navy);border-color:var(--navy);color:var(--bg);font-weight:700}

/* ---------- 시그니처: 옛 스프레드시트 탭 줄 ---------- */
#tabstrip{
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  padding:0 12px;margin-bottom:-1px;position:sticky;top:66px;z-index:35;
  background:linear-gradient(180deg,var(--bg) 58%,transparent);
  -webkit-overflow-scrolling:touch;
}
#tabstrip::-webkit-scrollbar{display:none}
.mtab{
  flex:0 0 auto;border:0;background:var(--soft);color:var(--ink3);
  font-family:var(--num);font-size:12px;font-weight:600;
  padding:9px 13px 8px;border-radius:10px 10px 0 0;
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%);
  transition:background .14s,color .14s,padding .14s;
}
.mtab.on{background:var(--card2);color:var(--ink);padding-top:12px;box-shadow:0 -2px 0 var(--navy) inset}
.mtab .dot{display:block;height:3px;border-radius:2px;margin-top:5px;background:var(--coral);opacity:.3}
.mtab.on .dot{opacity:1}

/* ---------- 판 ---------- */
#main{padding:14px 14px 8px;max-width:760px;margin:0 auto}
.page{display:block}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:17px;margin-bottom:12px;
  backdrop-filter:blur(14px);
  animation:rise .42s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.2s}.card:nth-child(n+7){animation-delay:.24s}
.card.tight{padding:13px 15px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:13px}
.sec h2{font-size:14.5px;display:flex;align-items:center;gap:7px}
.sec h2 svg{width:15px;height:15px;opacity:.75;flex:0 0 auto}
.sec .hint{font-size:11px;color:var(--ink3);text-align:right;flex:0 0 auto}

/* 세그먼트 */
.seg{display:flex;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:13px}
.seg button{flex:1;border:0;background:none;color:var(--ink3);border-radius:999px;padding:9px 6px;font-size:12.5px;font-weight:600;transition:.15s}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.2)}
body.day .seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}

/* 히어로 */
.hero .big{font-family:var(--num);font-weight:700;font-size:clamp(36px,10.5vw,50px);letter-spacing:-.035em;line-height:1.02}
.hero .big .won{font-size:.36em;font-weight:500;color:var(--ink3);margin-left:5px;letter-spacing:0}
.hero .sub{display:flex;flex-wrap:wrap;gap:7px 15px;margin-top:12px;font-size:12px;color:var(--ink3)}
.hero .sub b{font-family:var(--num);font-weight:600;color:var(--ink2)}
.hero.gold .big{color:var(--gold)}
.hero.gold .eyebrow{color:var(--gold);opacity:.75}

/* 증감 배지 */
.delta{font-family:var(--num);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink3);white-space:nowrap}
.delta.up{background:rgba(248,123,107,.15);color:var(--coral)}
.delta.down{background:rgba(87,214,169,.15);color:var(--jade)}
body.day .delta.up{background:rgba(192,64,92,.1)} body.day .delta.down{background:rgba(15,123,108,.1)}

/* 이중 막대 = 이 앱의 서명 */
.dbar{position:relative;height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.dbar .full{position:absolute;inset:0 auto 0 0;border-radius:5px;background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.dbar .mine{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--coral);transition:width .5s cubic-bezier(.22,1,.36,1)}
.dbar.in .mine{background:var(--jade)} .dbar.mov .mine{background:var(--sky)} .dbar.gold .mine{background:var(--gold)}

/* 줄 */
.rows{display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.row .ic{grid-row:1/2;grid-column:1;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.row .ic svg{width:15px;height:15px}
.row .nm{grid-column:2;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{grid-column:3;font-family:var(--num);font-size:13.5px;font-weight:600;white-space:nowrap}
.row .bar{grid-column:1/-1}
.row .meta{grid-column:1/-1;font-size:11px;color:var(--ink3);display:flex;gap:9px;flex-wrap:wrap}
.row:not(.hasic) .nm{grid-column:1/3}

/* 칩 */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:-2px 0 13px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink3);
  border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg);font-weight:700}

/* 알림 */
.alert{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;backdrop-filter:blur(10px)}
.alert .k{font-size:10.5px;font-weight:700;color:var(--warn);white-space:nowrap;padding-top:2px;letter-spacing:.02em}
.alert .b{font-size:12.5px;color:var(--ink2);line-height:1.5}
.alert b{color:var(--ink)}
.alert button{border:0;background:var(--warn);color:#12161F;border-radius:8px;padding:6px 11px;font-size:11px;font-weight:700;margin-top:7px}

/* 읽어 주는 말 */
.ins{display:flex;flex-direction:column;gap:12px}
.ins .i{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;font-size:13px;line-height:1.55;color:var(--ink2)}
.ins .i .k{font-size:10px;font-weight:700;color:var(--bg);background:var(--ink2);
  border-radius:6px;padding:4px 7px;white-space:nowrap;margin-top:1px;letter-spacing:.02em}
.ins .i .k.up{background:var(--coral)} .ins .i .k.down{background:var(--jade)} .ins .i .k.gold{background:var(--gold)}
.ins b{color:var(--ink);font-weight:700}

/* 그래프 */
svg.spark{display:block;width:100%;height:132px;overflow:visible}
svg.spark.tall{height:172px}
svg.spark .grid{stroke:var(--line2);stroke-width:1}
svg.spark .lab{font-family:var(--num);font-size:9px;fill:var(--ink3)}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:9px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10px;color:var(--ink3);text-align:center;padding:2px 0}
.cal .d{position:relative;aspect-ratio:1;border-radius:9px;background:var(--soft);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;overflow:hidden}
.cal .d.has{border-color:var(--line)}
.cal .d .n{font-family:var(--num);font-size:10px;color:var(--ink3)}
.cal .d .v{font-family:var(--num);font-size:9px;font-weight:600;color:var(--coral)}
.cal .d .fill{position:absolute;left:0;right:0;bottom:0;background:var(--coral);opacity:.16}
.cal .d.sat .n{color:var(--sky)} .cal .d.sun .n{color:var(--coral)}

/* 잔디 */
.heatwrap{overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.heatwrap::-webkit-scrollbar{display:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:3px}
.heat i{width:10px;height:10px;border-radius:2.5px;background:var(--soft);display:block}
.heatleg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink3);margin-top:9px}
.heatleg i{width:9px;height:9px;border-radius:2.5px;display:inline-block}

/* 장부 (옛 양식) */
.book{width:100%;border-collapse:collapse;font-size:12.5px}
.book th{position:sticky;top:0;background:var(--solid);color:var(--ink3);font-weight:600;font-size:10.5px;
  padding:8px;text-align:left;white-space:nowrap;z-index:2;border-bottom:1px solid var(--line)}
.book td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.book tr.newday td{border-top:1px solid var(--line)}
.book .dt{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.book .money{font-family:var(--mono);text-align:right;white-space:nowrap;font-weight:600}
.book .money.out{color:var(--coral)} .book .money.in{color:var(--jade)} .book .money.mov{color:var(--sky)}
.book .pl{font-weight:600} .book .de{color:var(--ink3);font-size:11.5px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -17px;padding:0 17px}

/* 자산 트리 */
.tree{display:flex;flex-direction:column}
.tree .t{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.tree .t.d1{font-weight:700;font-size:13.5px}
.tree .t.d2{font-size:13px;padding-left:13px;color:var(--ink2)}
.tree .t.d3{font-size:12.5px;padding-left:28px;color:var(--ink3)}
.tree .t .amt{font-family:var(--num);font-weight:600;font-size:12.5px}
.tree .t .side{font-size:10.5px;color:var(--ink3);margin-left:7px;font-family:var(--num)}
.tree .t.d1 .amt{font-size:14px;color:var(--gold)}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--soft);color:var(--ink3);font-weight:600;font-size:10.5px;padding:7px 8px;text-align:left;white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;color:var(--ink2)}
.tbl td.n{font-family:var(--num);text-align:right;font-weight:600;color:var(--ink)}
.tbl td.pos{color:var(--jade)} .tbl td.neg{color:var(--coral)}
.tbl td.nm{white-space:normal;font-weight:600;color:var(--ink)}

/* 입력 폼 */
.form{display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.02em}
.fl>span em{font-style:normal;color:var(--coral);margin-left:3px}
input,select,textarea{
  width:100%;border:1px solid var(--line);background:var(--soft);border-radius:var(--r2);
  padding:12px 13px;font-size:15px;font-family:inherit;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;background:var(--card2)}
input.money{font-family:var(--num);font-weight:700;font-size:21px;letter-spacing:-.02em}
textarea{min-height:78px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:var(--r2);padding:14px 16px;font-size:14px;font-weight:700;background:var(--navy);color:var(--bg);width:100%}
body.day .btn{color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:12px;width:auto}
.btn[disabled]{opacity:.45}
.drop{border:1.5px dashed var(--line);border-radius:var(--r2);padding:20px;text-align:center;color:var(--ink3);font-size:12.5px;background:var(--soft)}
.drop.hot{border-color:var(--navy);color:var(--navy)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}

/* 판독 결과 */
.cand{border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;margin-bottom:8px;background:var(--soft)}
.cand .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cand .t b{font-size:13.5px}
.cand .t .amt{font-family:var(--num);font-weight:700;font-size:14px}
.cand .m{font-size:11.5px;color:var(--ink3);margin-top:4px}
.cand .act{display:flex;gap:6px;margin-top:10px}

/* 모달 */
#modal{position:fixed;inset:0;z-index:80;background:rgba(4,6,10,.6);display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.sheetwrap{width:100%;max-height:88vh;display:flex}
.sheet{background:var(--solid);width:100%;border-radius:20px 20px 0 0;padding:20px 17px calc(24px + env(safe-area-inset-bottom));
  overflow:auto;box-shadow:0 -10px 46px rgba(0,0,0,.5);border-top:1px solid var(--line);
  animation:up .3s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:720px){#modal{align-items:center;justify-content:center}
  .sheetwrap{max-width:520px;padding:20px}.sheet{border-radius:20px;border:1px solid var(--line)}}

/* 잠금 안내 */
.locked{text-align:center;padding:36px 16px;color:var(--ink3);font-size:13px;line-height:1.75}
.locked .btn{max-width:220px;margin:18px auto 0}

/* 하단바 */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--solid);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
body.day #tabbar{background:rgba(255,255,255,.95);backdrop-filter:blur(12px)}
#tabbar button{border:0;background:none;padding:11px 0 10px;font-size:11px;font-weight:600;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:4px}
#tabbar button svg{width:19px;height:19px}
#tabbar button.on{color:var(--navy)}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:55;
  width:52px;height:52px;border-radius:50%;border:0;background:var(--navy);color:var(--bg);font-size:27px;line-height:1;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
body.day #fab{color:#fff}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(136px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--sh)}
#stamp{text-align:center;font-family:var(--num);font-size:10px;color:var(--ink3);padding:6px 0 16px;line-height:1.8}
#stamp .bad{color:var(--coral);font-weight:700}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:28px 10px;line-height:1.6}
.foot{font-size:11px;color:var(--ink3);margin:11px 0 0;line-height:1.6}
.skel{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--card2),var(--soft));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- 원장 (옛 월별 탭) ---------- */
.ledhead{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.ledhead .lh{display:flex;flex-direction:column;gap:2px;min-width:78px}
.ledhead .lh span{font-size:10px;color:var(--ink3)}
.ledhead .lh b{font-size:15px;font-weight:700}

<script>

/* ===== js/config.js ===== */
/* 개인 설정. 채울 곳은 APPS_SCRIPT_URL 하나뿐입니다.
   시트 ID, 비밀번호, Gemini 키는 전부 Apps Script 의 Code.gs 에 있습니다.
   이 파일은 GitHub Pages 에 그대로 올라가 누구나 볼 수 있기 때문입니다. */
const CONFIG = {
  // Apps Script 웹 앱 주소.
  //   [배포 > 배포 관리] 를 열면 오른쪽에 [웹 앱] 칸과 [라이브러리] 칸이 따로 있습니다.
  //   [웹 앱] 칸 아래 URL 옆의 복사 단추로 가져오세요. 라이브러리 쪽이 아닙니다.
  //   맞는 모양: https://script.google.com/macros/s/AKfycb.../exec
  //   틀린 모양: https://script.google.com/macros/library/d/...   (라이브러리)
  //             AKfycb...                                        (배포 ID)
  APPS_SCRIPT_URL: "",

  // 화면 파일 버전. Code.gs 를 고칠 때만 SERVER_EXPECTED 를 올립니다
  APP_VERSION: "v2.0",
  SERVER_EXPECTED: "2",

  OWNER: "주현",

  // 자산 탭은 비밀번호를 넣어야 열립니다. false 로 두면 조회도 잠깁니다
  ASSET_NEEDS_AUTH: true,

  // 카드 캐시백은 별도 앱이 정본입니다. 자산 탭에서 링크로만 잇습니다
  CARD_APP_URL: "https://hyun6500.github.io/card/",
};

/* ===== js/core.js ===== */
/* core.js - 데이터 읽기와 집계.
   여기서만 원본 시트를 안다. 화면 파일은 이 함수들만 쓴다. */
const FILEV = window.FILEV || (window.FILEV = {});
FILEV.core = CONFIG.APP_VERSION;

const S = {
  future: [],
  people: { intro: [], love: [] },
  mailPresets: [],
  rows: [],          // 정규화된 기록
  meta: null,        // 분류표
  ym: "",            // 지금 보고 있는 달
  ready: false,
  tab: "month",
};

/* ---------- 작은 도구 ---------- */
/* ---------- 공휴일 ----------
   해마다 한 번만 서버에 묻고 기억해 둔다. 대체공휴일도 함께 온다. */
const HOL = { map: {}, asked: {} };
function holidayOf(date) { return HOL.map[date] || ""; }
async function ensureHolidays(y) {
  if (!y || HOL.asked[y]) return false;
  HOL.asked[y] = true;
  try {
    const j = await post("holidays", { y: y });
    Object.assign(HOL.map, j.days || {});
    return true;
  } catch (e) { return false; }
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const won = n => (Math.round(n || 0)).toLocaleString("ko-KR");
const wonS = n => { const v = Math.round(Math.abs(n || 0)); if (v >= 100000000) return (v / 100000000).toFixed(1).replace(/\.0$/, "") + "억"; if (v >= 10000) return (v / 10000).toFixed(v >= 1000000 ? 0 : 1).replace(/\.0$/, "") + "만"; return v.toLocaleString("ko-KR"); };
const pad2 = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const ymOf = iso => (iso || "").slice(0, 7);
const yOf = iso => (iso || "").slice(0, 4);
const shiftYM = (ym, k) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) + k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + pad2(m); };
const ymLabel = ym => ym.slice(2, 4) + "-" + ym.slice(5, 7);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const wdOf = iso => { const d = new Date(iso + "T00:00:00"); return isNaN(d) ? "" : WD[d.getDay()]; };

function toast(msg, ms) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, ms || 2200);
}

/* ---------- 시트 읽기 ---------- */
function normDate(v) {
  if (!v) return "";
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);            // 구글시트 로케일 대비
  if (m) return m[3] + "-" + pad2(m[1]) + "-" + pad2(m[2]);
  const d = new Date(s);
  if (!isNaN(d)) return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  return "";
}
function numOf(v) {
  if (typeof v === "number") return v;
  const t = String(v == null ? "" : v).replace(/[^0-9.-]/g, "");
  return t === "" || t === "-" ? 0 : parseFloat(t);
}

function rowsFromTable(head, body) {
  const ix = {}; head.forEach((h, i) => { ix[String(h || "").trim()] = i; });
  const g = (r, k) => { const i = ix[k]; return i == null ? "" : String(r[i] == null ? "" : r[i]).trim(); };
  const out = [];
  for (const r of body) {
    const date = normDate(g(r, "날짜"));
    const amt = numOf(g(r, "금액"));
    const sub = g(r, "소분류");
    if (!date || (!amt && !sub)) continue;
    const rate = (() => { const t = g(r, "부담률"); if (!t) return 1; const v = numOf(t); return t.includes("%") ? v / 100 : (v > 1.5 ? v / 100 : v); })();
    const disc = Math.max(0, Math.min(amt, numOf(g(r, "할인"))));
    const real = amt - disc;                       /* 할인을 뺀, 실제로 나간 돈 */
    const mine = numOf(g(r, "내 몫")) || Math.round(real * (rate || 1));
    out.push({
      no: numOf(g(r, "no")), 검수: g(r, "검수"), date, sub, big: g(r, "대분류"),
      kind: g(r, "구분") || "지출", amt, share: g(r, "누구 몫") || "내 몫 전부",
      rate: rate || 1, mine, place: g(r, "장소"), detail: g(r, "세부내역"),
      situ: g(r, "상황"), once: g(r, "일시성"), treat: g(r, "대접"), theme: g(r, "테마"),
      with: g(r, "동행"), pay: g(r, "결제수단"), memo: g(r, "메모"),
      time: g(r, "시각"), disc, discBy: g(r, "할인수단"), real,
      ym: ymOf(date), y: yOf(date),
    });
  }
  /* 같은 날짜 안의 차례는 no 가 아니라 시트에 놓인 차례를 따른다.
     그래야 [원장]에서 위아래로 옮겨도 no 를 건드리지 않고 순서가 바뀐다 */
  out.forEach((r, i) => { if (r.seq === undefined) r.seq = i; });
  out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq);
  /* 아직 오지 않은 달은 화면에 내지 않는다. 지우지는 않고 따로 담아 둔다.
     11월 기록을 8월에 미리 적어 두어도 8월 화면이 흔들리지 않게 하려는 것이다. */
  const cur = ymOf(todayISO());
  S.future = out.filter(r => r.ym > cur);
  return out.filter(r => r.ym <= cur);
}

async function post(action, payload) {
  if (!CONFIG.APPS_SCRIPT_URL) throw new Error("APPS_SCRIPT_URL 이 비어 있습니다");
  if (/\/macros\/library\//.test(CONFIG.APPS_SCRIPT_URL))
    throw new Error("라이브러리 주소가 들어 있습니다. 웹 앱 주소(/exec 로 끝나는 것)를 넣어 주세요");
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action }, payload || {})),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "서버가 거절했습니다");
  return j;
}

/** 서버가 돌려준 한 줄을 앱이 쓰는 모양으로 바꾼다. 통째로 다시 읽지 않기 위해서다. */
function rowFromValues(head, arr) {
  const list = rowsFromTable(head, [arr]);
  return list.length ? list[0] : null;
}

/* ---------- 저장한 것을 그 자리에서 반영 ----------
   9천 줄을 다시 받아 오면 몇 초가 걸린다. 방금 쓴 줄만 갈아 끼우고
   시트와의 어긋남은 다음에 켤 때 저절로 맞춰진다. */
function patchAdd(head, values) {
  const r = rowFromValues(head, values);
  if (!r) return null;
  const same = S.rows.filter(x => x.date === r.date);
  r.seq = same.length ? Math.max.apply(null, same.map(x => x.seq)) + 0.5 : (S.rows.length ? S.rows[S.rows.length - 1].seq + 0.5 : 0);
  if (r.ym > ymOf(todayISO())) { S.future.push(r); return r; }
  S.rows.push(r);
  S.rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq);
  cacheDrop();
  return r;
}
function patchUpdate(head, values, no) {
  const r = rowFromValues(head, values);
  if (!r) return null;
  const i = S.rows.findIndex(x => x.no === +no);
  if (i < 0) return null;
  r.seq = S.rows[i].seq;
  S.rows[i] = r;
  S.rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq);
  cacheDrop();
  return r;
}
function patchDel(no) {
  const i = S.rows.findIndex(x => x.no === +no);
  if (i >= 0) S.rows.splice(i, 1);
  cacheDrop();
}
function patchMove(no, dir) {
  const i = S.rows.findIndex(x => x.no === +no);
  if (i < 0) return;
  const j = dir === "up" ? i - 1 : i + 1;
  if (j < 0 || j >= S.rows.length) return;
  if (S.rows[j].date !== S.rows[i].date) return;
  const a = S.rows[i].seq;
  S.rows[i].seq = S.rows[j].seq;
  S.rows[j].seq = a;
  S.rows.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : x.seq - y.seq);
  cacheDrop();
}

function cacheLoad() {

/* ---------- 집계 ---------- */
const isOut = r => r.kind === "지출";
const isIn = r => r.kind === "수입";
const isMov = r => r.kind === "이체";

function monthRows(ym) { return S.rows.filter(r => r.ym === ym); }
function sumMine(rs, f) { return rs.reduce((a, r) => a + ((!f || f(r)) ? r.mine : 0), 0); }
function sumAmt(rs, f) { return rs.reduce((a, r) => a + ((!f || f(r)) ? r.amt : 0), 0); }

function monthStat(ym) {
  const rs = monthRows(ym);
  return {
    ym, n: rs.length,
    out: sumMine(rs, isOut), outFull: sumAmt(rs, isOut),
    inc: sumMine(rs, isIn), mov: sumMine(rs, isMov),
    get left() { return this.inc - this.out; },
    get rate() { return this.inc ? (this.inc - this.out) / this.inc : 0; },
  };
}

/** 이 달까지 실제로 기록이 있는 달들 (평균 계산용) */
function activeMonths(year) {
  const set = new Set(S.rows.filter(r => !year || r.y === year).map(r => r.ym));
  return Array.from(set).sort();
}
function avgOutOfYear(year) {
  const ms = activeMonths(year); if (!ms.length) return 0;
  return ms.reduce((a, m) => a + monthStat(m).out, 0) / ms.length;
}

function byKey(rs, keyFn, valFn) {
  const m = new Map();
  for (const r of rs) {
    const k = keyFn(r); if (!k) continue;
    const o = m.get(k) || { key: k, n: 0, mine: 0, amt: 0 };
    o.n++; o.mine += (valFn ? valFn(r) : r.mine); o.amt += r.amt; m.set(k, o);
  }
  return Array.from(m.values()).sort((a, b) => b.mine - a.mine);
}

function pct(now, before) {
  if (!before) return null;
  return (now - before) / before;
}

/* ---------- 고정 지출 감지 (메인탭 알림) ----------
   최근 3개 달에서 같은 소분류+장소가 매달 나왔으면 정기 항목으로 본다.
   이번 달에 아직 안 보이고, 늘 나오던 날 + 유예일이 지났으면 알린다. */
function recurring(ym, graceDays) {
  const grace = graceDays == null ? 3 : graceDays;
  const prev = [shiftYM(ym, -1), shiftYM(ym, -2), shiftYM(ym, -3)];
  const seen = new Map();
  prev.forEach((m, i) => {
    for (const r of monthRows(m)) {
      if (!isOut(r) && !isMov(r)) continue;
      const key = (r.sub || "") + "|" + (r.place || "").trim();
      if (!key.trim() || key === "|") continue;
      const o = seen.get(key) || { key, sub: r.sub, place: r.place, months: new Set(), days: [], amts: [], last: r, situ: "" };
      o.months.add(m); o.days.push(+r.date.slice(8, 10)); o.amts.push(r.mine); o.last = r;
      if (r.situ === "정기결제") o.situ = "정기결제";
      seen.set(key, o);
    }
  });
  const cur = monthRows(ym);
  const has = new Set(cur.map(r => (r.sub || "") + "|" + (r.place || "").trim()));
  const today = todayISO();
  const out = [];
  for (const o of seen.values()) {
    if (o.months.size < 3) continue;            // 세 달 내리 나온 것만
    if (has.has(o.key)) continue;
    // 금액이 들쭉날쭉하면 고정 지출이 아니라 우연히 겹친 것이다
    const mean = o.amts.reduce((a, b) => a + b, 0) / o.amts.length;
    if (!mean) continue;
    const sd = Math.sqrt(o.amts.reduce((a, b) => a + (b - mean) * (b - mean), 0) / o.amts.length);
    const steady = o.situ === "정기결제" || sd / mean <= 0.45;
    if (!steady) continue;
    const day = Math.round(o.days.reduce((a, b) => a + b, 0) / o.days.length);
    const due = ym + "-" + pad2(Math.min(28, day));
    const dl = new Date(due + "T00:00:00"); dl.setDate(dl.getDate() + grace);
    const dueGrace = dl.getFullYear() + "-" + pad2(dl.getMonth() + 1) + "-" + pad2(dl.getDate());
    if (today < dueGrace) continue;             // 아직 기다려 볼 때
    const avg = Math.round(o.amts.reduce((a, b) => a + b, 0) / o.amts.length);
    out.push({ sub: o.sub, place: o.place, day, due, avg, sample: o.last });
  }
  return out.sort((a, b) => b.avg - a.avg);
}

/* ---------- 자산 (두 번째 DB. 읽기 전용) ----------
   가계부는 매일 쌓이고 자산 시트는 두 달에 한 번 갱신된다.
   그래서 자산 숫자는 반드시 기준일을 달고 보여 준다. */
const A = { data: null, loaded: false, denied: false, reason: "" };

function assetTotal() { return A.data ? (A.data.total || 0) : 0; }
function assetValued() { return A.data ? (A.data.valued || A.data.total || 0) : 0; }
function assetGap() { return assetValued() - assetTotal(); }   /* 평가손익 */

/** 자산 구성 트리에서 깊이 1 (은행 / 투자 / 기타) */
function assetTop() {
  if (!A.data) return [];
  return (A.data.tree || []).filter(t => t.depth === 1 && t.name !== "1" && t.amt);
}
function assetChildren(l2) {
  if (!A.data) return [];
  return (A.data.tree || []).filter(t => t.l2 === l2 && t.depth >= 2 && t.amt);
}

/** 예적금 만기. 비고의 "26년 8월 만기" 같은 표기를 날짜로 읽는다 */
function maturities() {
  if (!A.data) return [];
  const out = [];
  for (const d of (A.data.deposits || [])) {
    const m = String(d.note || "").match(/(\d{2})\s*년\s*(\d{1,2})\s*월\s*만기/);
    if (!m) { out.push({ name: d.name, amt: d.amt, rate: d.rate, note: d.note, due: "", days: null }); continue; }
    const y = 2000 + (+m[1]), mo = +m[2];
    const due = y + "-" + pad2(mo) + "-" + pad2(new Date(y, mo, 0).getDate());
    const days = Math.round((new Date(due + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
    out.push({ name: d.name, amt: d.amt, rate: d.rate, note: d.note, due, days });
  }
  return out.sort((a, b) => (a.days == null ? 9e9 : a.days) - (b.days == null ? 9e9 : b.days));
}

/** 순자산 곡선.
   실측 스냅샷이 있는 구간은 실측을 쓰고,
   그 앞 구간은 가계부의 (수입 - 지출)을 앵커에서 거꾸로 빼서 되짚는다.
   되짚은 값은 추정이므로 화면에서 점선으로 구분한다. */
const BACKFILL_MONTHS = 36;   /* 되짚는 구간을 3년으로 끊는다. 더 멀리 가면 기록 밖의 돈이 다 쌓여 그림이 거짓말을 한다 */
function netWorthSeries() {
  if (!A.data || !(A.data.history || []).length) return { est: [], real: [] };
  const hist = A.data.history.slice().sort((a, b) => a.d < b.d ? -1 : 1);
  const anchor = hist[0];
  const anchorYM = ymOf(anchor.d);
  const ms = Array.from(new Set(S.rows.map(r => r.ym)))
    .filter(m => m && m < anchorYM && m <= ymOf(todayISO())).sort().slice(-BACKFILL_MONTHS);
  const est = [];
  let v = anchor.cost;
  for (let i = ms.length - 1; i >= 0; i--) {
    const st = monthStat(ms[i]);
    est.push({ ym: ms[i], v: Math.round(v) });
    v -= (st.inc - st.out);
  }
  est.reverse();
  return { est, real: hist.map(h => ({ ym: ymOf(h.d), d: h.d, v: h.cost, valued: h.valued })) };
}

/** 매매 원장 요약 */
function tradeStat() {
  const t = (A.data && A.data.trades) || [];
  const closed = t.filter(x => (x.block || "").indexOf("종료") >= 0);
  const open = t.filter(x => (x.block || "").indexOf("종료") < 0);
  const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
  const win = closed.filter(x => (x.pnl || 0) > 0).length;
  return {
    closed, open,
    closedPnl: sum(closed, x => x.pnl), closedCost: sum(closed, x => x.cost),
    openCost: sum(open, x => x.cost),
    winRate: closed.length ? win / closed.length : 0, win, lose: closed.length - win,
  };
}

/** 연봉 곡선. 계약 연봉이 적힌 단계만 */
function salarySteps() {
  return ((A.data && A.data.salary) || []).filter(s => s.base).map(s => ({
    company: s.company, date: s.date, base: s.base, raise: s.raise, reason: s.reason, note: s.note,
  }));
}

/** 사이드 인컴. 시트는 연도별 합계라 거래로 더하지 않고 그대로 보여 준다 */
function sideByYear() {
  const m = new Map();
  for (const x of ((A.data && A.data.side) || [])) {
    if (!x.year) continue;
    const o = m.get(x.year) || { year: x.year, total: 0, items: [] };
    o.total += x.total || 0; o.items.push(x); m.set(x.year, o);
  }
  return Array.from(m.values()).sort((a, b) => b.year - a.year);
}


/* ---------- 읽어 주는 말 (규칙 기반) ----------
   통계 신호를 찾아 한국어 문장으로 바꾼다. 점수가 높은 것 몇 개만 내보낸다. */
const INSIGHT = (() => {

  function bigAvg(big, exceptYM, n) {
    const ms = Array.from(new Set(S.rows.map(r => r.ym))).filter(m => m && m !== exceptYM && m < exceptYM).sort().slice(-(n || 12));
    if (!ms.length) return 0;
    let s = 0;
    for (const m of ms) s += sumMine(monthRows(m), r => isOut(r) && (r.big || "기타") === big);
    return s / ms.length;
  }

  /* 진행 중인 달이면 지난 날 비율만큼 평균을 깎아서 견준다 */
  function fraction(ym) {
    if (ym !== ymOf(todayISO())) return 1;
    const d = new Date(), last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return Math.min(1, d.getDate() / last);
  }

  function build(ym) {
    const out = [];
    const rs = monthRows(ym), now = monthStat(ym), prev = monthStat(shiftYM(ym, -1));
    const partial = ym === ymOf(todayISO());
    const frac = fraction(ym);

    /* 1. 대분류 급등, 급락 */
    for (const b of byKey(rs.filter(isOut), r => r.big || "기타")) {
      const avg = bigAvg(b.key, ym) * frac;
      if (avg < 20000 && b.mine < 30000) continue;
      if (!avg) continue;
      const d = (b.mine - avg) / avg;
      if (Math.abs(d) < 0.4 || Math.max(b.mine, avg) < 30000) continue;
      if (partial && d < 0) continue;   /* 아직 끝나지 않은 달의 "아꼈다"는 성급하다 */
      const top = rs.filter(r => isOut(r) && (r.big || "기타") === b.key).sort((x, y) => y.mine - x.mine)[0];
      const why = top && top.mine > b.mine * 0.4 ? " " + esc(top.place || top.sub) + "(" + won(top.mine) + "원)이 컸습니다." : "";
      out.push({
        score: Math.abs(d) * Math.min(b.mine, 500000) / 1000,
        kind: d > 0 ? "up" : "down",
        tag: d > 0 ? "늘었다" : "줄었다",
        html: d > 0
          ? (d >= 2
            ? "<b>" + esc(b.key) + "</b>가 평소의 <b>" + (d + 1).toFixed(1) + "배</b>입니다." + why
            : "<b>" + esc(b.key) + "</b>가 평소보다 <b>" + Math.round(d * 100) + "%</b> 늘었습니다." + why)
          : "<b>" + esc(b.key) + "</b>를 평소보다 <b>" + Math.round(-d * 100) + "%</b> 덜 썼습니다.",
      });
    }

    /* 2. 석 달 내리 줄어든 대분류 */
    const ms4 = [shiftYM(ym, -3), shiftYM(ym, -2), shiftYM(ym, -1), ym];
    for (const b of byKey(rs.filter(isOut), r => r.big || "기타")) {
      const seq = ms4.map(m => sumMine(monthRows(m), r => isOut(r) && (r.big || "기타") === b.key));
      if (seq.every(v => v > 10000) && seq[0] > seq[1] && seq[1] > seq[2] && seq[2] > seq[3]) {
        out.push({ score: 42, kind: "down", tag: "석 달", html: "<b>" + esc(b.key) + "</b>가 석 달 내리 줄고 있습니다." });
        break;
      }
    }

    /* 3. 올해 저축률과 역대 최고 */
    const y = ym.slice(0, 4);
    const yr = yearStat(y);
    if (yr.inc > 0) {
      const past = years().filter(k => k < y).map(k => yearStat(k)).filter(s => s.months >= 10 && s.inc > 0);
      const best = past.length ? Math.max(...past.map(s => (s.inc - s.out) / s.inc)) : 0;
      const rate = (yr.inc - yr.out) / yr.inc;
      if (past.length && rate > best)
        out.push({ score: 56, kind: "gold", tag: "최고", html: "올해 저축률 <b>" + Math.round(rate * 100) + "%</b>. 기록상 가장 높은 흐름입니다." });
      else if (past.length)
        out.push({ score: 20, kind: "", tag: "저축률", html: "올해 누적 저축률 <b>" + Math.round(rate * 100) + "%</b>. 역대 최고는 " + Math.round(best * 100) + "%입니다." });
    }

    /* 4. 전월 대비 총지출 */
    if (!partial && prev.out) {
      const d = (now.out - prev.out) / prev.out;
      if (Math.abs(d) >= 0.15)
        out.push({
          score: 30, kind: d > 0 ? "up" : "down", tag: d > 0 ? "전월" : "전월",
          html: d > 0 ? "총지출이 지난달보다 <b>" + Math.round(d * 100) + "%</b> 많습니다."
            : "총지출을 지난달보다 <b>" + Math.round(-d * 100) + "%</b> 줄였습니다.",
        });
    }

    /* 5. 숨은 절약 */
    const sv = rs.filter(r => SAVE_RE.test((r.memo || "") + " " + (r.detail || "")));
    if (sv.length >= 3)
      out.push({ score: 18, kind: "down", tag: "절약", html: "이 달에 할인이나 캐시백을 챙긴 기록이 <b>" + sv.length + "건</b> 있습니다." });

    /* 6. 자산이 붙어 있으면, 모은 돈과 남은 돈이 다르다는 것 */
    if (A.data && assetGap() < 0) {
      out.push({
        score: 48, kind: "up", tag: "평가손",
        html: "모은 돈은 <b>" + wonS(assetTotal()) + "</b>인데 지금 값은 <b>" + wonS(assetValued()) +
          "</b>입니다. 투자에서 <b>" + wonS(Math.abs(assetGap())) + "</b>이 빠져 있습니다. (" + esc(A.data.asOf || "") + " 기준)",
      });
    }

    /* 7. 예적금 만기. 가장 가까운 한 건만. 같은 날 여러 건이면 묶어서 한 줄로 */
    const near = maturities().filter(m => m.days != null && m.days <= 45 && m.days >= -120);
    if (near.length) {
      const due = near[0].due;
      const same = near.filter(m => m.due === due);
      const amt = same.reduce((a, m) => a + (m.amt || 0), 0);
      const nm = same.length > 1 ? same[0].name + " 외 " + (same.length - 1) + "건" : same[0].name;
      const d = same[0].days;
      out.push({
        score: 60, kind: "gold", tag: "만기",
        html: "<b>" + esc(nm) + " " + wonS(amt) + "</b>이 " + esc(due) +
          (d >= 0 ? " 만기입니다. " + d + "일 남았습니다." : " 만기였습니다. " + (-d) + "일 지났습니다.") +
          " 자산 탭에서 금리와 함께 봅니다.",
      });
    }

    out.sort((a, b) => b.score - a.score);
    return out.slice(0, 4);
  }
  return { build };
})();

/* ---------- 연 단위 집계 ---------- */
function years() { return Array.from(new Set(S.rows.map(r => r.y))).filter(Boolean).sort(); }
function yearStat(y) {
  const rs = S.rows.filter(r => r.y === y);
  const ms = new Set(rs.map(r => r.ym));
  const inc = sumMine(rs, isIn), out = sumMine(rs, isOut);
  return { y, inc, out, mov: sumMine(rs, isMov), outFull: sumAmt(rs, isOut), months: ms.size, n: rs.length, left: inc - out };
}

/* ---------- 날마다 (잔디) ---------- */
function dayMap() {
  const m = new Map();
  for (const r of S.rows) if (isOut(r)) m.set(r.date, (m.get(r.date) || 0) + r.mine);
  return m;
}

/* ---------- 개인 물가지수 ----------
   같은 곳에서 되풀이해 산 것의 건당 평균이 해마다 어떻게 변했나.
   해가 셋 이상이고 해마다 세 번 이상 간 곳만 본다. */
function cpiItems(minYears, minPerYear) {
  const my = minYears || 3, mp = minPerYear || 3;
  const byPlace = new Map();
  for (const r of S.rows) {
    if (!isOut(r) || !r.place || !r.mine) continue;
    const p = r.place.trim(); if (!p) continue;
    const o = byPlace.get(p) || new Map();
    const y = o.get(r.y) || { n: 0, sum: 0 };
    y.n++; y.sum += r.mine; o.set(r.y, y); byPlace.set(p, o);
  }
  const out = [];
  for (const [p, ys] of byPlace) {
    const series = Array.from(ys.entries())
      .filter(([, v]) => v.n >= mp)
      .map(([y, v]) => ({ y, v: v.sum / v.n, n: v.n }))
      .sort((a, b) => a.y < b.y ? -1 : 1);
    if (series.length < my) continue;
    const first = series[0], last = series[series.length - 1];
    if (!first.v) continue;
    const sub = (S.rows.find(r => (r.place || "").trim() === p && isOut(r)) || {}).sub || "";
    out.push({ place: p, sub, series, change: (last.v - first.v) / first.v, n: series.reduce((a, s) => a + s.n, 0) });
  }
  return out.sort((a, b) => b.n - a.n);
}

/* ---------- 고정 지출 목록 ---------- */
function fixedCosts() {
  const ms = Array.from(new Set(S.rows.map(r => r.ym))).filter(m => m && m <= ymOf(todayISO())).sort().slice(-8);
  const map = new Map();
  for (const m of ms) for (const r of monthRows(m)) {
    if (!isOut(r) && !isMov(r)) continue;
    const k = (r.place || "").trim(); if (!k) continue;
    const o = map.get(k) || { place: k, sub: r.sub, months: new Set(), sum: 0, n: 0 };
    o.months.add(m); o.sum += r.mine; o.n++; map.set(k, o);
  }
  return Array.from(map.values())
    .filter(o => o.months.size >= 6 && o.sum / o.months.size >= 3000)
    .map(o => ({ place: o.place, sub: o.sub, avg: o.sum / o.months.size, months: o.months.size, n: o.n }))
    .sort((a, b) => b.avg - a.avg);
}

/* ---------- 요일과 달의 버릇 ---------- */
function weekdayProfile(rs) {
  const sum = Array(7).fill(0), days = [new Set(), new Set(), new Set(), new Set(), new Set(), new Set(), new Set()];
  for (const r of rs) {
    if (!isOut(r)) continue;
    const d = new Date(r.date + "T00:00:00"); if (isNaN(d)) continue;
    sum[d.getDay()] += r.mine; days[d.getDay()].add(r.date);
  }
  return sum.map((v, i) => ({ key: WD[i], mine: days[i].size ? Math.round(v / days[i].size) : 0, n: days[i].size, amt: 0 }));
}
function monthProfile(rs) {
  const sum = Array(12).fill(0), seen = [];
  for (let i = 0; i < 12; i++) seen.push(new Set());
  for (const r of rs) {
    if (!isOut(r)) continue;
    const mi = +r.ym.slice(5, 7) - 1;
    sum[mi] += r.mine; seen[mi].add(r.ym);
  }
  return sum.map((v, i) => ({ key: (i + 1) + "월", mine: seen[i].size ? Math.round(v / seen[i].size) : 0, n: seen[i].size, amt: 0 }));
}

function deltaBadge(v, invert) {

/** 달별 꺾은선 + 막대. pts = [{ym, out, inc}] */
function sparkMonths(pts, opt) {
  const o = opt || {};
  if (!pts.length) return '<div class="empty">그릴 값이 없습니다.</div>';
  const W = 320, H = 130, pl = 4, pr = 4, pt = 10, pb = 18;
  const maxV = Math.max(1, ...pts.map(p => Math.max(p.out || 0, o.line ? (p.inc || 0) : 0)));
  const n = pts.length, iw = (W - pl - pr) / n;
  let s = '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">';
  [0.5, 1].forEach(g => { const y = pt + (H - pt - pb) * (1 - g); s += '<line class="grid" x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>'; });
  pts.forEach((p, i) => {
    const h = (H - pt - pb) * ((p.out || 0) / maxV);
    const x = pl + i * iw + iw * 0.18, w = iw * 0.64;
    s += '<rect x="' + x.toFixed(1) + '" y="' + (H - pb - h).toFixed(1) + '" width="' + w.toFixed(1) +
      '" height="' + Math.max(0, h).toFixed(1) + '" rx="1.6" fill="' + (p.hi ? "var(--navy)" : "var(--out)") +
      '" opacity="' + (p.hi ? 1 : .82) + '"/>';
  });
  if (o.line) {
    const d = pts.map((p, i) => {
      const x = pl + i * iw + iw / 2, y = H - pb - (H - pt - pb) * ((p.inc || 0) / maxV);
      return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }).join(" ");
    s += '<path d="' + d + '" fill="none" stroke="var(--in)" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  }
  pts.forEach((p, i) => {
    if (n > 14 && i % 2) return;
    const x = pl + i * iw + iw / 2;
    s += '<text class="lab" x="' + x.toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(p.label || ymLabel(p.ym)) + "</text>";
  });
  return s + "</svg>";
}

/** 도넛. parts = [{key, mine, color}] */
function donut(parts, total) {
  const t = total || parts.reduce((a, p) => a + p.mine, 0);

    '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#F1F4F9" stroke-width="18"/>';

      '" stroke-width="18" stroke-dasharray="' + len.toFixed(2) + " " + (C - len).toFixed(2) +
      '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)"/>';

/** 달력 히트맵 */
function calendar(ym, rs) {
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0).getDate();
  const byDay = {};
  rs.filter(isOut).forEach(r => { const d = +r.date.slice(8, 10); byDay[d] = (byDay[d] || 0) + r.mine; });
  const mx = Math.max(1, ...Object.values(byDay));
  let s = '<div class="cal">' + WD.map(w => '<div class="h">' + w + "</div>").join("");
  for (let i = 0; i < first.getDay(); i++) s += '<div></div>';
  for (let d = 1; d <= last; d++) {
    const v = byDay[d] || 0, wd = new Date(y, m - 1, d).getDay();
    const hol = holidayOf(ym + "-" + pad2(d));
    s += '<div class="d' + (v ? " has" : "") + ((hol || wd === 0) ? " sun" : wd === 6 ? " sat" : "") +
      '" data-day="' + d + '"' + (hol ? ' title="' + esc(hol) + '"' : "") + ">" +

      '<span class="n">' + d + "</span>" + (v ? '<span class="v">' + wonS(v) + "</span>" : "") + "</div>";
  }
  return s + "</div>";
}

/** 잔디. days = [{d, v}] 를 요일 세로로 깔아 준다 */
function heatHTML(map, nDays) {
  const n = nDays || 371;
  const end = new Date(todayISO() + "T00:00:00");
  const start = new Date(end); start.setDate(start.getDate() - n + 1);
  start.setDate(start.getDate() - start.getDay());
  const vals = [];
  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    vals.push({ k, v: map.get(k) || 0 });
  }
  const nz = vals.map(x => x.v).filter(v => v > 0).sort((a, b) => a - b);
  const q = p => nz.length ? nz[Math.min(nz.length - 1, Math.floor(nz.length * p))] : 0;
  const t1 = q(.25), t2 = q(.55), t3 = q(.82);
  const shade = v => !v ? "var(--soft)" : v <= t1 ? "rgba(179,58,90,.20)" : v <= t2 ? "rgba(179,58,90,.42)"
    : v <= t3 ? "rgba(179,58,90,.68)" : "var(--out)";
  const cells = vals.map(x =>
    '<i style="background:' + shade(x.v) + '" title="' + x.k + " " + (x.v ? won(x.v) + "원" : "기록 없음") + '"></i>').join("");
  return '<div class="heatwrap"><div class="heat">' + cells + "</div></div>" +
    '<div class="heatleg">적음' +
    [0, t1, t2, t3, t3 + 1].map(v => '<i style="background:' + shade(v) + '"></i>').join("") +
    "많음 <span style=\"margin-left:auto\">최근 " + Math.round(n / 30) + "달</span></div>";
}

/** 두 겹 꺾은선. a 는 실선, b 는 점선(추정) */
function lineChart(series, opt) {
  const o = opt || {};
  const all = series.reduce((a, s) => a.concat(s.pts), []);
  if (!all.length) return '<div class="empty">그릴 값이 없습니다.</div>';
  const W = 320, H = o.h || 150, pl = 4, pr = 4, ptop = 10, pb = 18;
  const xs = Array.from(new Set(all.map(p => p.x))).sort();
  const maxV = Math.max(1, ...all.map(p => p.y));
  const minV = o.zero === false ? Math.min(...all.map(p => p.y)) : 0;
  const span = Math.max(1, maxV - minV);
  const X = i => pl + (W - pl - pr) * (xs.length > 1 ? i / (xs.length - 1) : .5);
  const Y = v => ptop + (H - ptop - pb) * (1 - (v - minV) / span);
  let s = '<svg class="spark' + (o.h ? " tall" : "") + '" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">';
  [0, .5, 1].forEach(g => { const y = ptop + (H - ptop - pb) * g; s += '<line class="grid" x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>'; });
  for (const se of series) {
    const d = se.pts.map((p, i) => {
      const ix = xs.indexOf(p.x);
      return (i ? "L" : "M") + X(ix).toFixed(1) + " " + Y(p.y).toFixed(1);
    }).join(" ");
    s += '<path d="' + d + '" fill="none" stroke="' + (se.color || "var(--navy)") + '" stroke-width="' + (se.w || 2) +
      '"' + (se.dash ? ' stroke-dasharray="4 3"' : "") + ' stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
    if (se.dot) se.pts.forEach(p => {
      s += '<circle cx="' + X(xs.indexOf(p.x)).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.4" fill="' + (se.color || "var(--navy)") + '"/>';
    });
  }
  const step = Math.max(1, Math.ceil(xs.length / 7));
  xs.forEach((x, i) => {
    if (i % step && i !== xs.length - 1) return;
    s += '<text class="lab" x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + esc(o.label ? o.label(x) : x) + "</text>";
  });
  return s + "</svg>";
}

/* ---------- 쌓은 막대 ----------
   달마다 대분류를 위로 쌓는다. keys 는 위에서부터의 순서다. */
function stackHTML(months, keys, getter, opt) {
  const o = opt || {};
  if (!months.length) return '<div class="empty">그릴 값이 없습니다.</div>';
  const data = months.map(m => {
    const vals = keys.map(k => getter(m, k) || 0);
    return { m, vals, tot: vals.reduce((a, b) => a + b, 0) };
  });
  const maxV = Math.max(1, ...data.map(d => d.tot));
  const W = 320, H = o.h || 170, pl = 4, pr = 4, pt = 10, pb = 18;
  const iw = (W - pl - pr) / data.length;
  let s = '<svg class="spark tall" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">';
  [0, .5, 1].forEach(g => { const y = pt + (H - pt - pb) * g; s += '<line class="grid" x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>'; });
  data.forEach((d, i) => {
    let acc = 0;
    const x = pl + i * iw + iw * .16, w = iw * .68;
    d.vals.forEach((v, ki) => {
      if (!v) return;
      const h = (H - pt - pb) * (v / maxV);
      acc += h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + (H - pb - acc).toFixed(1) + '" width="' + w.toFixed(1) +
        '" height="' + h.toFixed(1) + '" fill="' + colorOf(keys[ki]) + '" opacity=".92"><title>' +
        esc(d.m + " " + keys[ki] + " " + won(v)) + "</title></rect>";
    });
  });
  const step = Math.max(1, Math.ceil(data.length / 8));
  data.forEach((d, i) => {
    if (i % step && i !== data.length - 1) return;
    s += '<text class="lab" x="' + (pl + i * iw + iw / 2).toFixed(1) + '" y="' + (H - 5) +
      '" text-anchor="middle">' + esc(d.m.slice(2).replace("-", ".")) + "</text>";

    '<span><i style="background:' + colorOf(k) + '"></i>' + esc(k) + "</span>").join("") + "</div>";
}

/* ---------- 좌우로 갈라지는 막대 (손익) ---------- */
function divergeBars(items, opt) {
  const o = opt || {};
  if (!items.length) return '<div class="empty">그릴 값이 없습니다.</div>';
  const mx = Math.max(1, ...items.map(i => Math.abs(i.v)));
  return '<div class="dvg">' + items.map(i => {
    const p = Math.abs(i.v) / mx * 50;
    const pos = i.v >= 0;
    return '<div class="dv"><div class="k">' + esc(i.key) + "</div>" +
      '<div class="track"><i style="' + (pos ? "left:50%" : "right:50%") + ";width:" + p.toFixed(1) + "%;background:" +
      (pos ? "var(--jade)" : "var(--coral)") + '"></i><b class="mid"></b></div>' +
      '<div class="v" style="color:' + (pos ? "var(--jade)" : "var(--coral)") + '">' +
      (pos ? "+" : "-") + won(Math.abs(i.v)) + (o.sub ? '<em>' + esc(o.sub(i)) + "</em>" : "") + "</div></div>";
  }).join("") + "</div>";
}

/* ---------- 흩뿌린 점 ---------- */
function scatterHTML(pts, opt) {
  const o = opt || {};
  if (!pts.length) return '<div class="empty">그릴 값이 없습니다.</div>';
  const W = 320, H = o.h || 170, pl = 26, pr = 6, pt = 10, pb = 20;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = 0, x1 = Math.max(1, ...xs);
  const y0 = Math.min(0, ...ys), y1 = Math.max(0.01, ...ys);
  const X = v => pl + (W - pl - pr) * ((v - x0) / (x1 - x0 || 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - y0) / (y1 - y0 || 1));
  let s = '<svg class="spark tall" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">';
  [0, .5, 1].forEach(g => { const y = pt + (H - pt - pb) * g; s += '<line class="grid" x1="' + pl + '" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>'; });
  if (y0 < 0 && y1 > 0) s += '<line x1="' + pl + '" y1="' + Y(0).toFixed(1) + '" x2="' + W + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3 3"/>';
  pts.forEach(p => {
    s += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (p.r || 3.4) +
      '" fill="' + (p.y >= 0 ? "var(--jade)" : "var(--coral)") + '" opacity=".8"><title>' + esc(p.t || "") + "</title></circle>";
  });
  s += '<text class="lab" x="' + pl + '" y="' + (H - 5) + '">' + esc(o.xmin || "0") + "</text>";
  s += '<text class="lab" x="' + (W - pr) + '" y="' + (H - 5) + '" text-anchor="end">' + esc(o.xmax || String(Math.round(x1))) + "</text>";
  s += '<text class="lab" x="0" y="' + (pt + 4) + '">' + Math.round(y1 * 100) + "%</text>";
  s += '<text class="lab" x="0" y="' + (H - pb) + '">' + Math.round(y0 * 100) + "%</text>";
  return s + "</svg>";
}

/* ---------- 만기 타임라인 ---------- */
function timelineHTML(items) {
  if (!items.length) return "";
  const mx = Math.max(1, ...items.map(i => i.days == null ? 0 : Math.max(0, i.days)));
  const amx = Math.max(1, ...items.map(i => i.amt || 0));
  return '<div class="tline">' + items.map(i => {
    const d = i.days == null ? null : Math.max(0, i.days);
    const left = d == null ? 0 : d / mx * 88;
    const w = 6 + (i.amt || 0) / amx * 10;
    const soon = d != null && d <= 45;
    return '<div class="tl"><div class="k">' + esc(i.name) + "</div>" +
      '<div class="track"><i style="left:' + left.toFixed(1) + "%;width:" + w.toFixed(1) + "%;background:" +
      (soon ? "var(--coral)" : "var(--gold)") + '"></i></div>' +
      '<div class="v">' + (d == null ? "-" : d + "일") + "</div></div>";
  }).join("") + '<div class="tlfoot"><span>오늘</span><span>' + mx + "일 뒤</span></div></div>";
}

  (P.intro || []).forEach(x => { if (x.area) s.add(x.area); });
  return Array.from(s).sort();
}

/** 지금 적고 있는 내용에 걸리는 규칙을 찾는다. */
function ruleCheck(v) {
  const hit = [], errors = [];
  let fill = null;
  for (const r of RULES) {
    let on = false;
    try { on = !!r.on(v); } catch (e) { on = false; }
    if (!on) continue;
    hit.push(r);
    if (r.fill) { const f = r.fill(v); if (f) fill = Object.assign(fill || {}, f); }
    const n = r.need(v);
    if (n) errors.push(Object.assign({ key: r.key }, n));
  }
  return { hit, errors, fill };
}

/* 숨긴 알림.
   영영 지우는 길은 두지 않는다. 지금은 필요 없어도 나중에 다시 볼 일이 생기고,
   그때 되살릴 방법이 없으면 아쉬워진다. 그래서 둘 다 되돌릴 수 있게 했다.
     넘기기 - 이 달 동안만 숨긴다. 다음 달이면 저절로 돌아온다
     끄기   - 그 갈래를 계속 숨긴다. [숨긴 알림 되살리기] 로 언제든 되돌린다 */
const DISMISS = (() => {
  let m = {};
  try { m = JSON.parse(localStorage.getItem("jh_dismiss") || "{}"); } catch (e) { m = {}; }
  const save = () => { try { localStorage.setItem("jh_dismiss", JSON.stringify(m)); } catch (e) { } };
  return {
    skip: (k, ym) => { m["m:" + k + "@" + ym] = 1; save(); },
    mute: kind => { m["k:" + kind] = 1; save(); },
    off: (k, kind, ym) => !!(m["k:" + kind] || m["m:" + k + "@" + ym]),
    count: () => Object.keys(m).length,
    muted: () => Object.keys(m).filter(x => x.indexOf("k:") === 0).map(x => x.slice(2)),
    reset: () => { m = {}; save(); },
  };
})();

    });

  /* 4. 앞당겨 적어 둔 것 */

  /* 5. 이 달의 씀씀이가 앞서간다 */
  if (isCur) {

      });

  /* 6. 며칠째 안 적었다 */
  if (isCur) {
    const last = S.rows.length ? S.rows[S.rows.length - 1].date : "";
    if (last) {
      const gap = Math.round((new Date(todayISO()) - new Date(last)) / 86400000);
      if (gap >= 4) out.push({
        key: "gap:" + last, tag: "비었음",
        html: "마지막 기록이 <b>" + esc(last) + "</b>입니다. " + gap + "일째 비어 있습니다.",
        act: { label: "지금 적기", go: () => goTab("add") },
      });

  /* 7. 소개팅과 데이트인데 이력에 없는 이름 */
  const P = S.people || { intro: [], love: [] };
  if ((P.intro || []).length) {
    const known = new Set([].concat(P.intro, P.love).map(x => x.with || x.name).filter(Boolean));
    const miss = new Set();
    S.rows.forEach(r => {
      if (r.theme !== "소개팅" && r.theme !== "데이트") return;
      (r.with || "").split(/[,;\/]/).forEach(n => { const t = n.trim(); if (t && !known.has(t)) miss.add(t); });
    });
    if (miss.size) out.push({
      key: "noperson:" + Array.from(miss).sort().join(","), tag: "이력 없음",
      html: "이력 시트에 없는 이름이 <b>" + miss.size + "명</b> 있습니다. (" +
        esc(Array.from(miss).slice(0, 4).join(", ")) + (miss.size > 4 ? " 외" : "") +
        ") 그 사람 지출이 이력 시트에서 집계되지 않습니다.",
      act: { label: "기록실에서 보기", go: () => { HL.seg = "theme"; TH.mode = "소개팅"; goTab("hall"); } },
    });
  }

  /* 8. 자산 스냅샷이 오래됐다 */
  if (A.data && A.data.asOf) {
    const gap = Math.round((new Date(todayISO()) - new Date(A.data.asOf)) / 86400000);
    if (gap >= 45) out.push({
      key: "asset:" + A.data.asOf, tag: "자산 갱신",
      html: "자산 시트의 마지막 기록이 <b>" + esc(A.data.asOf) + "</b>입니다. " + gap +
        "일 지났습니다. 로그에 한 줄 더하면 순자산 곡선이 이어집니다.",
      act: { label: "자산 보기", go: () => { AS.seg = "now"; goTab("asset"); } },
    });
  }

  /* 9. 예적금 만기 */
  for (const m of maturities()) {
    if (m.days == null || m.days > 45 || m.days < -120) continue;
    out.push({
      key: "mat:" + m.name + ":" + m.due, tag: "만기",
      html: "<b>" + esc(m.name) + " " + wonS(m.amt) + "</b>이 " + esc(m.due) +
        (m.days >= 0 ? " 만기입니다. " + m.days + "일 남았습니다." : " 만기였습니다. " + (-m.days) + "일 지났습니다."),
      act: { label: "자산 보기", go: () => { AS.seg = "now"; goTab("asset"); } },
    });
  }

  /* 10. 규칙에 어긋난 줄 */
  const broke = S.rows.filter(r => {
    if (r.situ === "여행 중" && r.big && r.big !== "여행") return true;
    if ((r.sub === "용돈" || r.sub === "선물") && !r.treat) return true;
    if (r.theme === "데이트" && r.treat !== "연인") return true;
    return false;
  });
  if (broke.length) out.push({
    key: "broke:" + broke.length, tag: "규칙",
    html: "예외 규칙과 어긋난 줄이 <b>" + broke.length + "건</b> 있습니다. (여행 중인데 여행 분류가 아니거나, 용돈과 선물에 대접이 비었거나)",
  });

  out.forEach(a => { if (!a.kind) a.kind = a.key.split(":")[0]; });
  return out.filter(a => !DISMISS.off(a.key, a.kind, ym));
}
