/* 지금 보고 있는 폼. 고치기 창이 열려 있으면 그 안을 본다.
   두 폼이 동시에 화면에 있을 수 있어서, 범위를 정해 두지 않으면 엉뚱한 칸을 읽는다. */
function fscope() {
  const md = $("#modal");
  return (md && !md.hidden) ? $("#modalBody") : $("#p-add");
}

function readForm() {
  const R = fscope();
  const g = id => { const n = $(id, R); return n ? n.value : ""; };
  const sub = g("#f_sub").trim();
  const m = (S.meta && S.meta.subs || []).find(s => s.sub === sub);
  return {
    date: g("#f_date"), amt: numOf(g("#f_amt")), sub,
    big: m ? m.big : "", kind: m ? m.kind : "지출",
    place: g("#f_place").trim(), detail: g("#f_detail").trim(),
    share: g("#f_share"), pay: g("#f_pay"), situ: g("#f_situ"),
    treat: g("#f_treat"), theme: g("#f_theme"), once: g("#f_once"),
    with: g("#f_with").trim(), memo: g("#f_memo").trim(),
    time: g("#f_time"), disc: numOf(g("#f_disc")), discBy: g("#f_discBy").trim(),
  };
}
function validate(v) {
  if (!v.date) return "날짜를 골라 주세요";
  if (!v.amt) return "금액을 넣어 주세요";
  if (!v.sub) return "소분류를 골라 주세요";
  if (!v.place) return "장소를 넣어 주세요";
  if (v.disc && v.disc > v.amt) return "할인이 금액보다 큽니다";
  if (v.disc && !v.discBy) return "무엇으로 할인받았는지 [할인수단] 을 적어 주세요";
  const R = ruleCheck(v);
  if (R.errors.length) return R.errors[0].msg;
  return "";
}
function bindBigHint() {
  const R = fscope();
  const f = () => {
    const sub = $("#f_sub", R) ? $("#f_sub", R).value : "";
    const m = (S.meta && S.meta.subs || []).find(s => s.sub === sub);
    const h = $("#f_bigHint", R);
    if (h) h.textContent = m ? m.big + " / " + m.kind : "";
    paintRules();
  };
  ["#f_sub", "#f_situ", "#f_treat", "#f_theme", "#f_share", "#f_once", "#f_time"].forEach(id => {
    const n = $(id, R); if (n) n.onchange = f;
  });
  ["#f_amt", "#f_disc"].forEach(id => { const n = $(id, R); if (n) n.oninput = paintReal; });
  const w = $("#f_with", R); if (w) w.oninput = paintRules;
  const pl = $("#f_place", R);
  if (pl) pl.onchange = () => { runSuggest(true); paintRules(); };
  const am = $("#f_amt", R);
  if (am) am.onchange = () => runSuggest(false);
  f();
}

/** 할인을 뺀 실제 결제액을 칸 아래에 적어 준다. */
function paintReal() {
  const R = fscope();
  const el = $("#f_realHint", R);
  if (!el) return;
  const amt = numOf($("#f_amt", R) ? $("#f_amt", R).value : "");
  const disc = numOf($("#f_disc", R) ? $("#f_disc", R).value : "");
  if (!disc) { el.textContent = ""; return; }
  const real = Math.max(0, amt - disc);
  el.innerHTML = "영수증 " + won(amt) + "원 중 " + won(disc) + "원을 할인받아 <b>실제 결제 " +
    won(real) + "원</b>입니다. 통계에는 실제 결제액이 들어갑니다.";
}

/** 지난 기록에서 배운 것을 칸에 채우고 한 줄로 알려 준다. */
function runSuggest(fill) {
  const R = fscope();
  const box = $("#f_sugg", R);
  if (!box) return;
  const place = $("#f_place", R) ? $("#f_place", R).value.trim() : "";
  const amt = numOf($("#f_amt", R) ? $("#f_amt", R).value : "");
  const time = $("#f_time", R) ? $("#f_time", R).value : "";
  const sub = $("#f_sub", R) ? $("#f_sub", R).value : "";
  const sg = suggestFor(place, amt);
  ADD.sugg = sg;
  box.innerHTML = suggestHTML(sg, { time, sub });
  if (fill) {
    const done = applySuggest(sg, R, { time, sub });
    if (done.length) { bindBigHint(); toast("지난 기록으로 채웠습니다: " + done.join(", ")); }
  }
  paintReal();
  paintRules();
}

/** 지금 걸리는 규칙을 폼 아래에 띄우고, 모자란 칸을 짚어 준다. */
function paintRules() {
  const R = fscope();
  const box = $("#f_rules", R);
  if (!box) return;
  const v = readForm();
  const chk = ruleCheck(v);

  /* 비어 있을 때만 채운다. 이미 적은 것을 덮지 않는다 */
  if (chk.fill) for (const k in chk.fill) {
    const n = $("#f_" + k, R);
    if (n && !n.value) n.value = chk.fill[k];
  }

  $$(".fl", R).forEach(x => x.classList.remove("need"));
  chk.errors.forEach(e => { const fl = $("#fl_" + e.field, R); if (fl) fl.classList.add("need"); });

  let who = "";
  if ((v.theme === "소개팅" || v.theme === "데이트") && v.with) {
    const p = findPerson(v.with);
    who = p
      ? '<div class="rhint"><b>' + esc(p.kind) + "</b><span>" +
        esc(v.with) + " / " + esc([p.route, p.maker].filter(Boolean).join(" ") || "루트 미기재") +
        (p.first ? " / 첫 만남 " + esc(p.first) : "") + (p.n ? " / " + p.n + "번 만남" : "") +
        " (이력 시트에 있는 사람입니다)</span></div>"
      : '<div class="rhint bad"><b>새 이름</b><span>' + esc(v.with) + " 은 [" +
        (v.theme === "데이트" ? "연애 이력" : "소개팅 이력") + "] 시트에 없습니다. 주선자와 루트는 가계부가 아니라 그 시트에 사람당 한 번 적습니다. " +
        '<button class="btn sm" id="newPerson" style="margin-top:6px">이력에 더하기</button></span></div>';
  }

  if (!chk.hit.length && !who) { box.innerHTML = ""; return; }
  box.innerHTML = who + chk.hit.map(r => {
    const bad = chk.errors.find(e => e.key === r.key);
    return '<div class="rhint' + (bad ? " bad" : "") + '"><b>' + esc(r.title) + "</b>" +
      "<span>" + esc(bad ? bad.msg : r.how) + "</span></div>";
  }).join("");
  const np = $("#newPerson", R);
  if (np) np.onclick = () => openNewPerson(v.with, v.date, v.theme === "데이트" ? "love" : "intro");
}

/** 이미 같은 것이 있나 본다. 날짜와 금액이 같으면 의심한다. */
function dupOf(v) {
  return S.rows.filter(r => r.date === v.date && Math.abs(r.amt - v.amt) < 1);
}

/** 같은 것이 있을 때 무엇을 할지 묻는다. over(덮어쓰기) / add(그냥 더하기) / skip */
function askDup(v, hits) {
  return new Promise(resolve => {
    openModal(
      '<h2 style="font-size:16px;margin-bottom:2px">이미 있는 것 같습니다</h2>' +
      '<p style="font-size:11.5px;color:var(--ink3);margin:0 0 14px">' + esc(v.date) +
      " 에 " + won(v.amt) + "원짜리 기록이 " + hits.length + "건 있습니다.</p>" +
      '<div class="rows">' + hits.map(r =>
        '<div class="row hasic"><div class="ic" style="background:' + colorOf(r.big || "기타") + '22;color:' +
        colorOf(r.big || "기타") + '">' + (icon(r.big) || "") + "</div>" +
        '<div class="nm">' + esc(r.place || r.sub) + "</div>" +
        '<div class="amt">' + won(r.amt) + "</div>" +
        '<div class="meta"><span>no ' + r.no + "</span><span>" + esc(r.sub) + "</span>" +
        (r.detail ? "<span>" + esc(r.detail) + "</span>" : "") + "</div></div>").join("") + "</div>" +
      '<div style="height:14px"></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      (hits.length === 1
        ? '<button class="btn" id="duOver">위의 것을 지금 내용으로 고치기</button>' : "") +
      '<button class="btn ghost" id="duAdd">그래도 새로 더하기</button>' +
      '<button class="btn ghost" id="duSkip">이번 건은 건너뛰기</button></div>'
    );
    const done = x => { closeModal(true); resolve(x); };
    const o = $("#duOver"); if (o) o.onclick = () => done({ act: "over", no: hits[0].no });
    $("#duAdd").onclick = () => done({ act: "add" });
    $("#duSkip").onclick = () => done({ act: "skip" });
  });
}

async function submitAdd() {
  const v = readForm(), bad = validate(v);
  if (bad) return toast(bad);
  if (!await ensureAuth()) return;

  let mode = { act: "add" };
  const hits = dupOf(v);
  if (hits.length) mode = await askDup(v, hits);
  if (mode.act === "skip") {
    if (nextInQueue()) toast("건너뛰었습니다");
    else toast("건너뛰었습니다");
    return;
  }

  const b = $("#saveBtn");
  if (b) { b.disabled = true; b.textContent = "넣는 중"; }
  try {
    const j = (mode.act === "over")
      ? await post("update", { token: AUTH.token, no: mode.no, row: v })
      : await post("add", { token: AUTH.token, row: v });
    /* 9천 줄을 다시 받지 않는다. 방금 쓴 줄만 갈아 끼운다 */
    if (j.head && j.values) {
      if (mode.act === "over") patchUpdate(j.head, j.values, mode.no);
      else patchAdd(j.head, j.values);
    } else {
      await loadAll();
    }
    S.ym = ymOf(v.date);
    paintTabs(); renderAll();
    /* 방금 넣은 것과 같은 후보에 표시를 남긴다 */
    const hit = ADD.cands.find(c => !c.done && c.date === v.date && Math.abs((c.amt || 0) - v.amt) < 1);
    if (hit) hit.done = true;

    const more = nextInQueue();
    const left = ADD.cands.filter(c => !c.done).length;
    paintCands();
    if (more) {
      toast(mode.act === "over" ? "고쳤습니다. 다음 건입니다" : "적었습니다. 다음 건입니다");
    } else if (left) {
      /* 아직 손대지 않은 후보가 남아 있으면 목록을 잃지 않게 입력 화면에 머문다 */
      toast("적었습니다. 아직 " + left + "건 남아 있습니다");
      clearForm();
    } else {
      markMailDone();
      clearAddSession();
      toast(mode.act === "over" ? "고쳤습니다" : "적었습니다");
      /* 적은 달의 원장을 바로 보여 준다. 아직 오지 않은 달이면 화면에 없으니 그대로 둔다 */
      if (ymOf(v.date) <= ymOf(todayISO())) goTab("ledger");
      else toast("아직 오지 않은 달이라 그 달이 되면 나타납니다");
    }
  } catch (e) { toast("실패: " + e.message); }
  if (b) { b.disabled = false; b.textContent = "기록 더하기"; }
}

/** 대기줄에서 하나 꺼내 칸을 채운다. */
function nextInQueue() {
  const box = $("#qBar");
  if (!ADD.queue.length) {
    if (box) box.innerHTML = "";
    ADD.qTotal = 0;
    return false;
  }
  const c = ADD.queue.shift();
  fillFromCand(c);
  const done = ADD.qTotal - ADD.queue.length;
  if (box) box.innerHTML =
    '<div class="qbar"><b>' + done + " / " + ADD.qTotal + "</b>" +
    "<span>차례로 넣는 중입니다. 소분류를 골라 저장하면 다음 건이 올라옵니다.</span>" +
    '<button class="btn sm ghost" id="qStop">그만</button></div>';
  const st = $("#qStop");
  if (st) st.onclick = () => { ADD.queue = []; ADD.qTotal = 0; $("#qBar").innerHTML = ""; toast("차례 넣기를 멈췄습니다"); };
  return true;
}

/* ---------- 메일에서 영수증 긁어오기 ----------
   앱 결제 영수증처럼 메일로만 오는 것이 있다. 서버가 메일을 읽어 후보를 만들어 준다.
   시트에 넣는 것은 사람이 확인한 뒤에만 한다. */
async function pullMail(preset, btn) {
  if (!await ensureAuth()) return;
  const b = btn || null;
  const label = b ? b.textContent : "";
  if (b) { b.disabled = true; b.textContent = "읽는 중"; }
  const hint = $("#mailHint");
  if (hint) hint.textContent = "메일을 읽고 있습니다. 통수가 많으면 조금 걸립니다.";
  try {
    const j = await post("mail", { token: AUTH.token, days: 90, preset: preset || "all" });
    ADD.mailIds = j.ids || [];
    const items = (j.items || []).filter(x => x.amt);
    if (!items.length) {
      toast(j.n ? "메일 " + j.n + "통을 읽었지만 결제 건을 찾지 못했습니다" : "새 영수증 메일이 없습니다");
    } else {
      ADD.cands = items;
      paintCands();
      toast("메일 " + j.n + "통에서 " + items.length + "건을 찾았습니다");
    }
  } catch (e) { toast("실패: " + e.message); }
  if (b) { b.disabled = false; b.textContent = label; }
  if (hint) hint.textContent = "누르면 그 갈래의 메일을 읽어 후보를 만듭니다. 시트에는 확인한 뒤에만 들어갑니다.";
}

/** 다 넣은 뒤 그 메일에 이름표를 붙여 다시 안 걸리게 한다. */
async function markMailDone() {
  if (!ADD.mailIds || !ADD.mailIds.length) return;
  try {
    await post("mailDone", { token: AUTH.token, ids: ADD.mailIds });
    ADD.mailIds = [];
  } catch (e) { }
}

async function addShots(files) {
  for (const f of Array.from(files || [])) {
    if (!f.type.startsWith("image/")) continue;
    if (ADD.shots.length >= 4) { toast("한 번에 넉 장까지"); break; }
    const b64 = await shrink(f, 1300);
    ADD.shots.push(b64);
  }
  paintShots();
}

function paintShots() {
  const box = $("#thumbs");
  if (!box) return;
  box.innerHTML = ADD.shots.map((b, i) =>
    '<div class="th"><img src="data:image/jpeg;base64,' + b + '">' +
    '<button class="x" data-s="' + i + '" title="지우기">지움</button></div>').join("") +
    (ADD.shots.length > 1 ? '<button class="btn sm ghost" id="shotClear">모두 지우기</button>' : "");
  $$("[data-s]", box).forEach(b => b.onclick = e => {
    e.stopPropagation();
    ADD.shots.splice(+b.dataset.s, 1);
    paintShots();
  });
  const c = $("#shotClear");
  if (c) c.onclick = e => { e.stopPropagation(); ADD.shots = []; paintShots(); };
}
function shrink(file, max) {
  return new Promise(res => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .82).split(",")[1]);
    }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

async function doRead() {
  const text = $("#pasteBox").value.trim();
  if (!text && !ADD.shots.length) return toast("화면이나 글을 먼저 넣어 주세요");
  const b = $("#readBtn"); b.disabled = true; b.textContent = "읽는 중";
  try {
    const j = await post("parse", { text, shots: ADD.shots, today: todayISO() });
    ADD.cands = j.items || [];
    paintCands();
    if (!ADD.cands.length) toast("찾지 못했습니다. 직접 적어 주세요");
  } catch (e) { toast("읽기 실패: " + e.message); }
  b.disabled = false; b.textContent = "읽어 오기";
}

function paintCands() {
  const box = $("#cands");
  if (!box) return;
  if (!ADD.cands.length) { box.innerHTML = ""; return; }
  /* 같은 날이면 이른 시각이 먼저 오게. 시트에서도 그 차례로 쌓인다 */
  ADD.cands.sort((x, y) => {
    const a1 = (x.date || "") + " " + (x.time || "99:99");
    const b1 = (y.date || "") + " " + (y.time || "99:99");
    return a1 < b1 ? -1 : a1 > b1 ? 1 : 0;
  });
  const left = ADD.cands.filter(c => !c.done).length;
  box.innerHTML = '<div class="sec"><h2 style="font-size:13px">찾은 것 ' + ADD.cands.length + "건</h2>" +
    '<span class="hint">' + (left < ADD.cands.length ? "넣은 것 " + (ADD.cands.length - left) + "건 / 남은 것 " + left + "건"
      : left > 1 ? "이른 시각부터 차례로" : "고르면 아래 칸이 채워집니다") + "</span></div>" +
    (left > 1 ? '<button class="btn ghost" id="qAll" style="margin-bottom:10px">남은 ' + left +
      "건 차례로 넣기</button>" : "") +
    ADD.cands.map(function (c, i) {
      const dup = c.done ? null : dupOf({ date: c.date, amt: c.amt });
      const flag = c.done
        ? '<span class="cflag done">넣었음</span>'
        : (dup && dup.length ? '<span class="cflag dup">중복 의심</span>' : "");
      return '<div class="cand' + (c.done ? " off" : "") + '"><div class="t"><b>' + esc(c.place || "장소 모름") +
        "</b>" + flag + '<span class="amt">' + won(c.amt) + "원</span></div>" +
        '<div class="m">' + [c.date, c.time, c.pay, c.sub, c.detail, c.src].filter(Boolean).map(esc).join(" / ") + "</div>" +
        (dup && dup.length
          ? '<div class="m" style="color:var(--warn)">같은 날 같은 금액이 이미 ' + dup.length + "건 있습니다. (" +
            esc(dup.slice(0, 2).map(r => r.place || r.sub).join(", ")) + ")</div>"
          : "") +
        '<div class="act">' +
        (c.done ? "" : '<button class="btn sm" data-i="' + i + '">이 내용으로 채우기</button>') +
        '<button class="btn sm ghost" data-x="' + i + '">제외</button></div></div>';
    }).join("") +
    '<button class="btn ghost sm" id="candClear" style="width:100%;margin-top:8px">목록 비우기</button>';

  const qa = $("#qAll", box);
  if (qa) qa.onclick = () => {
    ADD.queue = ADD.cands.filter(c => !c.done);
    ADD.qTotal = ADD.queue.length;
    nextInQueue();
  };
  $$("[data-i]", box).forEach(b => b.onclick = () => {
    const c = ADD.cands[+b.dataset.i];
    ADD.queue = []; ADD.qTotal = 0;
    const q = $("#qBar"); if (q) q.innerHTML = "";
    fillFromCand(c);
    $("#f_place").scrollIntoView({ behavior: "smooth", block: "center" });
    toast("채웠습니다. 남은 칸을 확인해 주세요");
  });
  $$("[data-x]", box).forEach(b => b.onclick = () => {
    const c = ADD.cands[+b.dataset.x];
    ADD.cands.splice(+b.dataset.x, 1);
    ADD.queue = ADD.queue.filter(q => q !== c);
    ADD.qTotal = ADD.queue.length ? ADD.qTotal : 0;
    paintCands();
    toast("목록에서 뺐습니다");
  });
  const cc = $("#candClear", box);
  if (cc) cc.onclick = () => { clearAddSession(); toast("목록을 비웠습니다"); };
}

/** 후보와 그림을 한꺼번에 비운다. */
function clearAddSession() {
  ADD.cands = []; ADD.queue = []; ADD.qTotal = 0; ADD.shots = []; ADD.mailIds = [];
  paintCands(); paintShots();

}

  openModal(
    '<h2 style="font-size:16px;margin-bottom:2px">기록 고치기</h2>' +
    '<p style="font-size:11.5px;color:var(--ink3);margin:0 0 14px">no ' + r.no + " / " + esc(r.date) +
    (r.검수 ? ' <span style="color:var(--warn);font-weight:700">' + esc(r.검수) + "</span>" : "") + "</p>" +
    formHTML({
      date: r.date, amt: r.amt, sub: r.sub, place: r.place, detail: r.detail, share: r.share,
      pay: r.pay, situ: r.situ, treat: r.treat, theme: r.theme, once: r.once, with: r.with, memo: r.memo,
    }) +
    '<div style="display:flex;gap:8px;margin-top:16px">' +
    '<button class="btn" id="edSave">고치기</button>' +
    '<button class="btn ghost" id="edDel" style="max-width:96px">지우기</button></div>'
  );
  bindBigHint();
  $("#edSave").onclick = async () => {
    const v = readForm(); const bad = validate(v);
    if (bad) return toast(bad);
    if (!await ensureAuth()) return;
    try {
      const j = await post("update", { token: AUTH.token, no: r.no, row: v });
      closeModal(true); toast("고쳤습니다");
      if (j.head && j.values) patchUpdate(j.head, j.values, r.no); else await loadAll();
      paintTabs(); renderAll();
    }
    catch (e) { toast("실패: " + e.message); }
  };
  $("#edDel").onclick = async () => {
    if (!confirm("이 줄을 지웁니다. 되돌릴 수 없습니다.")) return;
    if (!await ensureAuth()) return;
    try {
      await post("del", { token: AUTH.token, no: r.no });
      closeModal(true); toast("지웠습니다");
      patchDel(r.no); paintTabs(); renderAll();
    }
    catch (e) { toast("실패: " + e.message); }
  };
}



/* ===== js/main.js ===== */
/* main.js - 켜기, 탭 옮기기, 달 고르기, 가리기와 밤 모드. */
FILEV.main = CONFIG.APP_VERSION;

const RENDER = { month: renderMonth, ledger: renderLedger, spend: renderSpend, asset: renderAsset, hall: renderHall, add: renderAdd };
const TITLE = { month: "이번 달", ledger: "원장", spend: "소비", asset: "자산", hall: "기록실", add: "입력" };
const DIRTY = { month: 1, ledger: 1, spend: 1, asset: 1, hall: 1, add: 1 };
const TABS = ["month", "ledger", "spend", "asset", "hall", "add"];
const BARTABS = ["month", "ledger", "spend", "asset", "hall"];
let LASTTAB = "month";   /* 입력을 닫으면 돌아갈 곳 */

const NAV = { skip: false };
function goTab(t, viaPop) {
  if (t === "add" && S.tab !== "add") LASTTAB = S.tab;
  const changed = S.tab !== t;
  S.tab = t;
  /* 기기의 뒤로가기가 앱 안에서 한 걸음 물러나게 한다 */
  if (!viaPop && changed) { try { history.pushState({ tab: t }, ""); } catch (e) { } }
  $$("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  TABS.forEach(k => { $("#p-" + k).hidden = k !== t; });
  $("#topTitle").textContent = TITLE[t];
  /* 달 탭 줄은 달을 고르는 화면에서만 */
  $("#tabstrip").hidden = !(t === "month" || t === "ledger" || (t === "spend" && SP.seg === "book"));
  $("#fab").hidden = (t === "add");
  if (DIRTY[t]) { RENDER[t](); DIRTY[t] = 0; }
  decorate($("#p-" + t));
  window.scrollTo({ top: 0, behavior: "instant" });
}
function renderAll() { Object.keys(DIRTY).forEach(k => DIRTY[k] = 1); RENDER[S.tab](); DIRTY[S.tab] = 0; decorate($("#p-" + S.tab)); }

/* 달 탭 줄 */
function paintTabs() {
  const strip = $("#tabstrip");
  /* 최근 달이 왼쪽에 오게 뒤집는다. 늘 보는 달이 손 닿는 자리에 있어야 한다 */
  const months = Array.from(new Set(S.rows.map(r => r.ym))).filter(Boolean);
  const cur = ymOf(todayISO());
  if (!months.includes(cur)) months.push(cur);
  if (!months.includes(S.ym)) months.push(S.ym);
  months.sort().reverse();
  const maxOut = Math.max(1, ...months.map(m => monthStat(m).out));
  strip.innerHTML = months.map(m => {
    const st = monthStat(m);
    return '<button class="mtab' + (m === S.ym ? " on" : "") + '" data-ym="' + m + '">' + ymLabel(m) +
      '<i class="dot" style="width:100%;transform:scaleX(' + Math.max(.08, st.out / maxOut).toFixed(2) + ');transform-origin:left"></i></button>';
  }).join("");
  $$(".mtab", strip).forEach(b => b.onclick = () => {
    S.ym = b.dataset.ym; paintTabs();
    ensureHolidays(+S.ym.slice(0, 4)).then(got => { if (got) { DIRTY.month = DIRTY.ledger = 1; RENDER[S.tab](); DIRTY[S.tab] = 0; } });
    DIRTY.month = DIRTY.ledger = DIRTY.spend = DIRTY.hall = 1;
    RENDER[S.tab](); DIRTY[S.tab] = 0;
  });
  const on = $(".mtab.on", strip);
  if (on && on.scrollIntoView) on.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" });
}

function stamp() {
  const n = Object.keys(FILEV).length;
  const bad = Object.values(FILEV).some(v => v !== CONFIG.APP_VERSION);
  let s = CONFIG.APP_VERSION + " (" + n + "/" + n + ")";
  if (S.rows.length) s += " 가계부 " + won(S.rows.length) + "줄";
  if (A.data) s += " 자산 " + esc(A.data.asOf || "");
  if (bad) s += ' <span class="bad">구버전 파일이 섞였습니다</span>';
  if (S.server && S.server !== CONFIG.SERVER_EXPECTED)
    s += ' <span class="bad">서버 ' + esc(S.server) + " 불일치, Code.gs 를 새 버전으로 다시 배포하세요</span>";
  $("#stamp").innerHTML = s;
}

/* 가리기와 밤 모드는 이 기기에만 남는다 */
function loadPrefs() {
  try {
    if (localStorage.getItem("jh_hush") === "1") document.body.classList.add("hush");
    if (localStorage.getItem("jh_day") === "1") document.body.classList.add("day");
  } catch (e) { }
  paintPrefs();
  paintBarIcons();
}
function paintPrefs() {
  const h = document.body.classList.contains("hush"), d = document.body.classList.contains("day");
  const hb = $("#hushBtn"), db = $("#dayBtn");
  if (hb) { hb.textContent = h ? "가림" : "보임"; hb.classList.toggle("open", h); }
  if (db) { db.textContent = d ? "밤" : "낮"; db.classList.toggle("open", d); }
}
/* 하단 탭바 아이콘은 한 번만 그린다 */
function paintBarIcons() {
  $$("#tabbar button").forEach(b => {
    if (b.querySelector("svg")) return;
    b.insertAdjacentHTML("afterbegin", icon(b.dataset.ic));
  });
}

/* ---------- 머리글 아이콘 ----------
   화면마다 문자열을 고치는 대신, 다 그린 뒤에 제목을 보고 앞에 붙인다. */
const HEAD_ICON = {
  "읽어 보면": "잎", "지금 가진 것": "자산", "무엇과 견주면": "그래프", "어디에 썼나": "그래프",
  "날마다": "달력", "큰 지출": "별", "달마다": "그래프", "달별 표": "달력",
  "대분류 흐름": "그래프", "소분류 순위": "그래프", "자주 간 곳": "지갑", "해마다": "달력",
  "내 물가": "그래프", "버릇": "시계", "매달 나가는 것": "시계", "이 달 통계": "그래프",
  "모아 온 길": "자산", "두 장부가 맞나": "자산", "무엇으로 가지고 있나": "자산",
  "예적금 만기": "시계", "카드 캐시백": "지갑", "매매 성적표": "그래프", "끝낸 거래": "그래프",
  "들고 있는 것": "지갑", "비상장": "별", "무엇에 넣었나": "그래프", "연봉 곡선": "그래프",
  "본업 밖의 수입": "수입", "가계부에 적힌 수입": "수입", "기록": "별",
  "가장 큰 지출 열 개": "별", "단골": "사람", "부모님께": "사람", "숨은 절약": "잎",
  "누구에게": "사람", "누구와": "사람", "무엇에": "그래프", "큰 기록": "별",
  "화면이나 글로 넣기": "더하기", "직접 적기": "더하기",
};
function decorate(box) {
  $$(".sec h2", box).forEach(h2 => {
    if (h2.querySelector("svg")) return;
    const t = h2.textContent.trim();
    const k = HEAD_ICON[t] || (/원장$/.test(t) ? "달력" : null);
    if (k) h2.insertAdjacentHTML("afterbegin", icon(k));
  });
}

async function boot() {
  loadPrefs();

  /* 지난번 자료가 기기에 있으면 그걸로 먼저 그린다. 기다리는 시간이 없어진다 */
  const cached = cacheLoad();
  let painted = false;
  if (cached) {
    try {
      seatData(cached);
      const months = Array.from(new Set(S.rows.map(r => r.ym))).sort();
      const cur = ymOf(todayISO());
      S.ym = months.includes(cur) ? cur : (months[months.length - 1] || cur);
      paintTabs(); goTab("month"); stamp();
      showStale(cached.at);
      painted = true;
    } catch (e) { painted = false; }
  }
  if (!painted) {
    $("#p-month").innerHTML = '<div class="card"><div class="skel" style="width:40%"></div>' +
      '<div class="skel" style="height:38px;margin:12px 0"></div>' +
      '<div class="skel" style="width:70%"></div></div>';
  }

  try {
    await loadAll();
  } catch (e) {
    if (painted) { toast("새 자료를 못 받았습니다. 지난번 것을 보고 있습니다"); return; }
    showConnError(e); stamp(); return;
  }

  const months = Array.from(new Set(S.rows.map(r => r.ym))).sort();
  const cur = ymOf(todayISO());
  if (!painted || !months.includes(S.ym)) S.ym = months.includes(cur) ? cur : (months[months.length - 1] || cur);
  paintTabs();
  if (painted) { renderAll(); hideStale(); } else { goTab("month"); }
  stamp();
  ensureHolidays(+S.ym.slice(0, 4)).then(got => {
    if (got) { DIRTY.month = DIRTY.ledger = 1; RENDER[S.tab](); DIRTY[S.tab] = 0; }
  });
}

/** 지난번 자료를 보고 있다는 띠 */
function showStale(at) {
  const mins = Math.round((Date.now() - (at || 0)) / 60000);
  const when = mins < 60 ? mins + "분 전" : Math.round(mins / 60) + "시간 전";
  let el = $("#staleBar");
  if (!el) {
    el = document.createElement("div");
    el.id = "staleBar";
    $("#main").insertAdjacentElement("beforebegin", el);
  }
  el.innerHTML = '<span class="dot"></span>' + when + " 자료를 먼저 보여 드립니다. 새로 읽는 중입니다.";
  el.hidden = false;
}
function hideStale() { const el = $("#staleBar"); if (el) el.hidden = true; }

/* ---------- 못 닿았을 때 ----------
   그냥 실패했다고만 하면 어디를 봐야 할지 알 수 없다.
   지금 쓰고 있는 주소를 그대로 보여 주고, 한 번에 열어 볼 수 있게 한다. */
function showConnError(e) {
  const url = CONFIG.APPS_SCRIPT_URL || "";
  const msg = String(e && e.message || e);
  const empty = !url;
  const fetchFail = /Failed to fetch|NetworkError|Load failed/i.test(msg);

  const lib = /\/macros\/library\//.test(url);
  const noExec = url && !/\/exec$/.test(url);

  const tips = empty
    ? ["<b>js/config.js 의 APPS_SCRIPT_URL 이 비어 있습니다.</b> 배포 관리에서 웹 앱 URL 을 복사해 넣어 주세요."]
    : lib
      ? [
        "<b>이 주소는 웹 앱 주소가 아니라 라이브러리 주소입니다.</b> " +
        "주소에 <b>/macros/library/</b> 가 들어 있으면 그렇습니다. 이 주소로는 앱이 시트에 닿을 수 없습니다.",
        "[배포 > 배포 관리] 를 열면 오른쪽에 <b>웹 앱</b> 칸과 <b>라이브러리</b> 칸이 따로 있습니다. " +
        "<b>웹 앱</b> 칸 아래 URL 옆의 [복사] 를 눌러 주세요. 라이브러리 쪽 [복사] 를 누른 것 같습니다.",
        "맞는 주소는 <b>/exec</b> 로 끝납니다. " +
        "<b>https://script.google.com/macros/s/AKfycb.../exec</b> 모양입니다. 배포 ID 도 아닙니다.",
        "고친 뒤 GitHub 에 올리고 새로고침을 세게 해 주세요. (윈도우 Ctrl+Shift+R, 맥 Cmd+Shift+R)",
      ]
      : noExec
        ? [
          "<b>이 주소는 /exec 로 끝나지 않습니다.</b> 웹 앱 주소가 아닐 수 있습니다.",
          "[배포 > 배포 관리] 의 <b>웹 앱</b> 칸 아래 URL 옆 [복사] 로 가져온 주소여야 합니다. " +
          "배포 ID 나 라이브러리 주소가 아닙니다.",
          "맞는 모양은 <b>https://script.google.com/macros/s/AKfycb.../exec</b> 입니다.",
        ]
        : fetchFail
      ? [
        "<b>아래 주소를 새 탭에서 열어 보세요.</b> JSON 이 보이면 서버는 살아 있는 것이고, 문제는 주소가 다르거나 낡은 것입니다. 로그인 화면이 뜨면 배포의 액세스 권한이 '모든 사용자' 가 아닙니다.",
        "<b>배포가 여럿이면 주소가 어긋나기 쉽습니다.</b> [배포 > 배포 관리] 에서 <b>활성</b> 배포의 웹 앱 URL 을 복사해, 아래 주소와 글자 하나까지 같은지 보세요. 보관처리된 배포의 주소는 응답하지 않습니다.",
        "<b>브라우저가 옛 config.js 를 들고 있을 수 있습니다.</b> 새로고침을 세게 해 주세요. (윈도우 Ctrl+Shift+R, 맥 Cmd+Shift+R)",
        "<b>파일을 두 번 누르지 말고</b> GitHub Pages 주소로 여세요. file:// 로 열면 막힙니다.",
      ]
        : ["서버가 대답은 했지만 거절했습니다. Apps Script 실행 기록에서 오류를 보실 수 있습니다."];

  $("#p-month").innerHTML =
    '<div class="card"><h2 style="font-size:15px;margin-bottom:10px">아직 시트에 닿지 못했습니다</h2>' +
    '<div style="font-size:12.5px;color:var(--ink3);margin-bottom:6px">앱이 쓰고 있는 주소</div>' +
    '<div style="font-family:var(--mono);font-size:11px;word-break:break-all;background:var(--soft);' +
    'border:1px solid var(--line);border-radius:10px;padding:10px;line-height:1.5">' +
    (url ? esc(url) : "(비어 있음)") + "</div>" +
    (url ? '<a class="btn" id="openExec" href="' + esc(url) + '" target="_blank" rel="noopener" ' +
      'style="display:block;text-align:center;text-decoration:none;margin-top:10px">이 주소를 새 탭에서 열어 보기</a>' : "") +
    '<div style="font-size:11px;color:var(--ink3);margin-top:14px">브라우저가 알려 준 것</div>' +
    '<div style="font-size:12px;color:var(--out);font-weight:600;margin-top:2px">' + esc(msg) + "</div>" +
    '<div style="height:14px"></div>' +
    '<div class="ins">' + tips.map((t, i) =>
      '<div class="i"><span class="k">' + (i + 1) + '</span><div>' + t + "</div></div>").join("") +
    "</div></div>";
}

/* 붙이기 */
$$("#tabbar button").forEach(b => b.onclick = () => goTab(b.dataset.tab));
try { history.replaceState({ tab: "month" }, ""); } catch (e) { }
window.addEventListener("popstate", e => {
  if (NAV.skip) { NAV.skip = false; return; }
  const st = e.state || {};
  /* 창이 열려 있으면 창부터 닫는다 */
  if (!$("#modal").hidden && !st.m) { closeModal(true, true); return; }
  if (st.tab && st.tab !== S.tab) goTab(st.tab, true);
  else if (!st.tab && S.tab !== "month") goTab("month", true);
});
$("#fab").onclick = () => goTab("add");
$("#reloadBtn").onclick = async () => {
  toast("다시 읽는 중");
  A.loaded = false; A.denied = false; A.data = null;
  await loadAll(); paintTabs(); renderAll(); stamp(); toast("최신입니다");
};
$("#lockBtn").onclick = () => { if (authAlive()) authLock(); else ensureAuth(); };
$("#hushBtn").onclick = () => {
  document.body.classList.toggle("hush");
  try { localStorage.setItem("jh_hush", document.body.classList.contains("hush") ? "1" : "0"); } catch (e) { }
  paintPrefs();
};
$("#dayBtn").onclick = () => {
  document.body.classList.toggle("day");
  try { localStorage.setItem("jh_day", document.body.classList.contains("day") ? "1" : "0"); } catch (e) { }
  paintPrefs();
  renderAll();          /* 그래프의 색이 CSS 변수를 따르므로 다시 그린다 */
};
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) paintLock(); });

paintLock();
boot();

</script>
